  deploy-socket:
    needs: prepare-source
    uses: ./.github/workflows/deploy-socket-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      git_sha: ${{ needs.prepare-source.outputs.git_sha }}
      source_artifact: source-code
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_API_KEY: ${{ secrets.JWT_API_KEY }}
