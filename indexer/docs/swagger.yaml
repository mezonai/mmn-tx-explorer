definitions:
  api.Error:
    description: Error represents an API error response
    properties:
      code:
        description: '@Description HTTP status code'
        type: integer
      message:
        description: '@Description Error message'
        type: string
      support_id:
        description: '@Description Support ID for tracking the error'
        type: string
    type: object
  api.Meta:
    description: Meta represents metadata for a query response
    properties:
      address:
        description: '@Description Contract address'
        type: string
      chain_id:
        description: '@Description Chain ID of the blockchain'
        type: integer
      limit:
        description: '@Description Number of items per page'
        type: integer
      page:
        description: '@Description Current page number'
        type: integer
      signature:
        description: '@Description Function or event signature'
        type: string
      total_items:
        description: '@Description Total number of items'
        type: integer
      total_pages:
        description: '@Description Total number of pages'
        type: integer
    type: object
  api.QueryResponse:
    description: QueryResponse represents the response structure for a query
    properties:
      aggregations:
        description: '@Description Aggregation results'
        items:
          additionalProperties: true
          type: object
        type: array
      data:
        description: '@Description Query result data'
      meta:
        allOf:
        - $ref: '#/definitions/api.Meta'
        description: '@Description Metadata for the query response'
    type: object
  common.BlockModel:
    properties:
      block_hash:
        type: string
      block_number:
        type: integer
      block_timestamp:
        type: integer
      chain_id:
        type: string
      parent_hash:
        type: string
      transaction_count:
        type: integer
    type: object
  common.LogModel:
    properties:
      address:
        type: string
      block_hash:
        type: string
      block_number:
        type: integer
      block_timestamp:
        type: integer
      chain_id:
        type: string
      data:
        type: string
      log_index:
        type: integer
      topics:
        items:
          type: string
        type: array
      transaction_hash:
        type: string
      transaction_index:
        type: integer
    type: object
  common.TransactionModel:
    properties:
      block_hash:
        type: string
      block_number:
        type: integer
      chain_id:
        type: string
      extra_info:
        type: string
      from_address:
        type: string
      hash:
        type: string
      nonce:
        type: integer
      status:
        type: integer
      text_data:
        type: string
      to_address:
        type: string
      transaction_timestamp:
        type: integer
      transaction_type:
        type: integer
      value:
        type: string
    type: object
  handlers.BlockDetailResponse:
    properties:
      data:
        properties:
          block:
            $ref: '#/definitions/common.BlockModel'
        type: object
    type: object
  handlers.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
      time:
        type: string
    type: object
  handlers.PendingTransactionModel:
    properties:
      from_address:
        type: string
      hash:
        type: string
      nonce:
        type: integer
      status:
        type: integer
      to_address:
        type: string
      transaction_timestamp:
        type: integer
      transaction_type:
        type: integer
      value:
        type: string
    type: object
  handlers.SearchResultModel:
    properties:
      blocks:
        items:
          $ref: '#/definitions/common.BlockModel'
        type: array
      events:
        items:
          $ref: '#/definitions/common.LogModel'
        type: array
      transactions:
        items:
          $ref: '#/definitions/common.TransactionModel'
        type: array
      type:
        $ref: '#/definitions/handlers.SearchResultType'
      wallets:
        items:
          additionalProperties: true
          type: object
        type: array
    type: object
  handlers.SearchResultType:
    enum:
    - block
    - transaction
    - event_signature
    - function_signature
    - address
    - contract
    - wallet
    type: string
    x-enum-varnames:
    - SearchResultTypeBlock
    - SearchResultTypeTransaction
    - SearchResultTypeEventSignature
    - SearchResultTypeFunctionSignature
    - SearchResultTypeAddress
    - SearchResultTypeContract
    - SearchResultTypeWallet
  handlers.TransactionDetailResponse:
    properties:
      data:
        properties:
          transaction:
            $ref: '#/definitions/common.TransactionModel'
        type: object
    type: object
  handlers.WalletDetailResponse:
    properties:
      data:
        additionalProperties: true
        type: object
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for indexing blockchain data.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Indexer API
  version: "1.0"
paths:
  /{chainId}/blocks:
    get:
      consumes:
      - application/json
      description: Retrieve all blocks
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Filter parameters
        in: query
        name: filter
        type: string
      - description: Field to group results by
        in: query
        name: group_by
        type: string
      - description: Field to sort results by
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc or desc)
        in: query
        name: sort_order
        type: string
      - description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 5
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - collectionFormat: csv
        description: List of aggregate functions to apply
        in: query
        items:
          type: string
        name: aggregate
        type: array
      - description: Force consistent data at the expense of query speed
        in: query
        name: force_consistent_data
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/common.BlockModel'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get all blocks
      tags:
      - blocks
  /{chainId}/blocks/{blockNumber}/detail:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific block including
        all transactions
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Block number
        in: path
        name: blockNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BlockDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get block detail
      tags:
      - detail
  /{chainId}/events:
    get:
      consumes:
      - application/json
      description: Retrieve all logs across all contracts
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Filter parameters
        in: query
        name: filter
        type: string
      - description: Field to group results by
        in: query
        name: group_by
        type: string
      - description: Field to sort results by
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc or desc)
        in: query
        name: sort_order
        type: string
      - description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 5
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - collectionFormat: csv
        description: List of aggregate functions to apply
        in: query
        items:
          type: string
        name: aggregate
        type: array
      - description: Force consistent data at the expense of query speed
        in: query
        name: force_consistent_data
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/common.LogModel'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get all logs
      tags:
      - events
  /{chainId}/pending-transactions:
    get:
      consumes:
      - application/json
      description: Retrieve all pending transactions from mempool
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handlers.PendingTransactionModel'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get pending transactions
      tags:
      - transactions
  /{chainId}/search/{input}:
    get:
      consumes:
      - application/json
      description: Search blocks, transactions and events
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Search input
        in: path
        name: input
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.QueryResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.SearchResultModel'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Search blockchain data
      tags:
      - search
  /{chainId}/transactions:
    get:
      consumes:
      - application/json
      description: Retrieve all transactions across all contracts
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Filter parameters
        in: query
        name: filter
        type: string
      - description: Field to group results by
        in: query
        name: group_by
        type: string
      - description: Field to sort results by
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc or desc)
        in: query
        name: sort_order
        type: string
      - description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 5
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Wallet address to filter transactions (optional)
        in: query
        name: wallet_address
        type: string
      - collectionFormat: csv
        description: List of aggregate functions to apply
        in: query
        items:
          type: string
        name: aggregate
        type: array
      - description: Force consistent data at the expense of query speed
        in: query
        name: force_consistent_data
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/common.TransactionModel'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get all transactions
      tags:
      - transactions
  /{chainId}/tx/{txHash}/detail:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific transaction including
        logs and traces
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Transaction hash
        in: path
        name: txHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransactionDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get transaction detail
      tags:
      - detail
  /{chainId}/wallets:
    get:
      consumes:
      - application/json
      description: Retrieve a list of wallets with sorting, filtering, and pagination
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Filter parameters (e.g. balance>1000)
        in: query
        name: filter
        type: string
      - description: Field to group results by
        in: query
        name: group_by
        type: string
      - description: 'Field to sort results by (default: balance)'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order (asc or desc, default: desc)'
        in: query
        name: sort_order
        type: string
      - description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 5
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Force consistent data at the expense of query speed
        in: query
        name: force_consistent_data
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.QueryResponse'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get wallets
      tags:
      - wallet
  /{chainId}/wallets/{address}/detail:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific wallet
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      - description: Wallet address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WalletDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get wallet detail
      tags:
      - wallet
  /health:
    get:
      consumes:
      - application/json
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - health
schemes:
- http
- https
swagger: "2.0"
