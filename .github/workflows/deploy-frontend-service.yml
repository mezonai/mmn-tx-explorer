name: Deploy Frontend Service
permissions:
  contents: write
  
on: 
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "main"
      mode:
        type: string
        required: true
        default: "build"
      target_tag:
        description: "(Optional) Existing tag to deploy"
        required: false
      source_tag:
        type: string
        required: false

  workflow_call:
    inputs:
      env:
        type: string
        required: true
      ref:
        type: string
        required: true
      mode:
        type: string
        required: true
      target_tag:
        type: string
        required: false
      source_tag:
        type: string
        required: false
    secrets:
      NEXT_PUBLIC_COBAR_API_KEY:
        required: true
      NEXT_PUBLIC_MEZON_SERVER_KEY:
        required: true

jobs:
  build:
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
      asset_name: ${{ steps.meta.outputs.asset_name }}
      asset_path: ${{ steps.meta.outputs.asset_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: false
          fetch-depth: 1

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "redeploy" ]; then
            DEPLOY_TAG="${{ inputs.source_tag }}"
          else
            DEPLOY_TAG="${{ inputs.target_tag }}"
          fi
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "asset_name=frontend-build-${DEPLOY_TAG}-${{ inputs.env }}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=build-frontend/frontend-build-${DEPLOY_TAG}-${{ inputs.env }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: inputs.mode == 'build'
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: ''

      - name: Build Frontend
        if: inputs.mode == 'build'
        id: build-frontend
        env: 
          NEXT_PUBLIC_APP_API_URL: ${{ vars.NEXT_PUBLIC_APP_API_URL }}
          APP_API_URL_INTERNAL: ${{ vars.APP_API_URL_INTERNAL }}
          NEXT_PUBLIC_CHAT_APP_MMN_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_MMN_API_URL }}
          NEXT_PUBLIC_CHAT_APP_ZK_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_ZK_API_URL }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_OAUTH2_API_URL: ${{ vars.NEXT_PUBLIC_OAUTH2_API_URL }}
          NEXT_PUBLIC_OAUTH2_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_OAUTH2_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_OAUTH2_REDIRECT_URI }}
          NEXT_PUBLIC_OAUTH2_SCOPE: ${{ vars.NEXT_PUBLIC_OAUTH2_SCOPE }}
          NEXT_BASE_FE: ${{ vars.NEXT_BASE_FE }}
          NEXT_PUBLIC_COBAR_API_URL: ${{ vars.NEXT_PUBLIC_COBAR_API_URL }}
          NEXT_PUBLIC_COBAR_API_KEY: ${{ secrets.NEXT_PUBLIC_COBAR_API_KEY }}
          NEXT_PUBLIC_TOP_MEZON_AI: ${{ vars.NEXT_PUBLIC_TOP_MEZON_AI }}
          NEXT_PUBLIC_BASE_FE: ${{ vars.NEXT_BASE_FE }}
          NEXT_PUBLIC_WEBSOCKET_URL: ${{ vars.NEXT_PUBLIC_WEBSOCKET_URL }}
          NEXT_PUBLIC_MEZON_SERVER_KEY: ${{ secrets.NEXT_PUBLIC_MEZON_SERVER_KEY }}
        run: |
          set -euo pipefail

          cd frontend

          rm -rf .next node_modules
          npm install
          npm run build

          mkdir -p .deploy
          cp -r .next/standalone/* .deploy/
          mkdir -p .deploy/.next
          cp -r .next/static .deploy/.next/
          cp -r public .deploy/

          cd .deploy

          mkdir -p ../../build-frontend
          tar -czf "../../${{ steps.meta.outputs.asset_path }}" .

      - name: Download source asset for repackage
        if: inputs.mode == 'repackage'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-frontend
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          SRC_RELEASE="${{ inputs.source_tag }}"
          SRC_ASSET="frontend-build-${{ inputs.source_tag }}-${{ inputs.env }}.tar.gz"
          URL="https://github.com/$OWNER/$REPO/releases/download/$SRC_RELEASE/$SRC_ASSET"
          echo "Downloading $URL"
          curl -sSL --fail -o "${{ steps.meta.outputs.asset_path }}" "$URL"
          chmod +x "${{ steps.meta.outputs.asset_path }}"

      - name: Upload packaged asset for release
        if: inputs.mode == 'build' || inputs.mode == 'repackage'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-asset
          path: ${{ steps.meta.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload deploy asset
        if: inputs.mode == 'build' || inputs.mode == 'repackage'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-asset
          path: ${{ steps.meta.outputs.asset_path }}
          if-no-files-found: error

  deploy:
    needs: build
    if: always()
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: false
          fetch-depth: 1
      
      - name: Download prepared asset
        if: inputs.mode == 'build' || inputs.mode == 'repackage'
        uses: actions/download-artifact@v4
        with:
          name: frontend-deploy-asset
          path: build-frontend

      - name: Determine Frontend Tag
        id: determine_tag
        run: |
          if [ "${{ inputs.mode }}" = "redeploy" ]; then
            TAG_TO_DEPLOY="${{ inputs.source_tag }}"
          else
            TAG_TO_DEPLOY="${{ inputs.target_tag }}"
          fi

          echo "tag_name=$TAG_TO_DEPLOY" >> $GITHUB_OUTPUT
          echo "asset_name=frontend-build-${TAG_TO_DEPLOY}-${{ inputs.env }}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=build-frontend/frontend-build-${TAG_TO_DEPLOY}-${{ inputs.env }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Download Frontend Release Bundle
        if: inputs.mode == 'redeploy'
        run: | 
          set -euo pipefail

          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          TAG_NAME="${{ steps.determine_tag.outputs.tag_name }}"
          FRONTEND_NAME="${{ steps.determine_tag.outputs.asset_name }}"
          FRONTEND_PATH="${{ steps.determine_tag.outputs.asset_path }}"
          DOWNLOAD_URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG_NAME}/${FRONTEND_NAME}"

          echo "==> Downloading Frontend Bundle from: $DOWNLOAD_URL"
          mkdir -p build-frontend
          curl -sSL --fail -L -o "$FRONTEND_PATH" "$DOWNLOAD_URL"
          chmod +x "$FRONTEND_PATH"
          ls -lh "$FRONTEND_PATH"


      - name: Generate remote setup script
        env:
          NEXT_PUBLIC_APP_API_URL: ${{ vars.NEXT_PUBLIC_APP_API_URL }}
          APP_API_URL_INTERNAL: ${{ vars.APP_API_URL_INTERNAL }}
          NEXT_PUBLIC_CHAT_APP_MMN_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_MMN_API_URL }}
          NEXT_PUBLIC_CHAT_APP_ZK_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_ZK_API_URL }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_OAUTH2_API_URL: ${{ vars.NEXT_PUBLIC_OAUTH2_API_URL }}
          NEXT_PUBLIC_OAUTH2_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          NEXT_PUBLIC_OAUTH2_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_OAUTH2_REDIRECT_URI }}
          NEXT_PUBLIC_OAUTH2_SCOPE: ${{ vars.NEXT_PUBLIC_OAUTH2_SCOPE }}
          NEXT_BASE_FE: ${{ vars.NEXT_BASE_FE }}
          NEXT_PUBLIC_COBAR_API_URL: ${{ vars.NEXT_PUBLIC_COBAR_API_URL }}
          NEXT_PUBLIC_COBAR_API_KEY: ${{ secrets.NEXT_PUBLIC_COBAR_API_KEY }}
          NEXT_PUBLIC_TOP_MEZON_AI: ${{ vars.NEXT_PUBLIC_TOP_MEZON_AI }}
          NEXT_PUBLIC_BASE_FE: ${{ vars.NEXT_BASE_FE }}
          NEXT_PUBLIC_WEBSOCKET_URL: ${{ vars.NEXT_PUBLIC_WEBSOCKET_URL}}
          NEXT_PUBLIC_MEZON_SERVER_KEY: ${{ secrets.NEXT_PUBLIC_MEZON_SERVER_KEY }}
        run: |
          printenv | grep -E '^(NEXT_|APP_)' > frontend.env

      - name: Prepare and deploy to target server
        run: |
          set -e
          echo "==> Copying env file to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} frontend.env ${{ vars.HOST_ALIAS }}:/tmp/frontend_tmp.env 

          echo "==> Copying frontend bundle..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ steps.determine_tag.outputs.asset_path }} ${{ vars.HOST_ALIAS }}:/tmp/frontend.tar.gz

          echo "==> Applying configuration on server..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS}} "
            set -e 
            echo '==> Extracting frontend bundle'
            sudo rm -rf /opt/frontend/.next/standalone/*
            sudo mkdir -p /opt/frontend/.next/standalone

            sudo tar -xzf /tmp/frontend.tar.gz -C /opt/frontend/.next/standalone

            echo '==> Updating /opt/frontend/...'
            sudo mv /tmp/frontend_tmp.env /opt/frontend/frontend.env
            sudo chown mmn:mmn /opt/frontend/frontend.env
            sudo chmod 600 /opt/frontend/frontend.env

            sudo rm -f /tmp/frontend_tmp.env
            sudo rm -f /tmp/frontend.tar.gz
            "

      - name: Atomic swap + restart services
        run: |
          ssh -i ${{vars.SSH_PRIVATE_KEY_PATH}} ${{vars.HOST_ALIAS}} <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          echo '==> Stopping frontend service...'
          sudo systemctl stop frontend-explorer || true

          echo "==> Reloading and starting services..."
          sudo systemctl daemon-reload
          sudo systemctl start frontend-explorer

          echo "==> Reloading Nginx..."
          sudo nginx -t && sudo systemctl reload nginx

          echo "==> Activation complete!"
          EOF

      - name: Health check after deployment 
        run: |
          echo "==> Checking Frontend status..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "systemctl is-active frontend-explorer"