name: Deploy WebSocket Service

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch / commit for dev, tag for prod)"
        required: true

  workflow_call:
    inputs:
      env:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      POSTGRES_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      EVENT_API_KEY:
        required: true
      REDIS_PASSWORD:
        required: true

jobs:
  build:
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: false

      - name: Resolve deploy version
        id: version
        run: |
          if [[ "${{ inputs.env }}" == "prod" ]]; then
            if [[ ! "${{ inputs.ref }}" =~ ^v[0-9]+ ]]; then
              echo "Prod must be deployed by tag"
              exit 1
            fi
            VERSION="${{ inputs.ref }}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="dev-${SHORT_SHA}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          check-latest: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: socket-service
          args: --timeout=5m --output.text.print-issued-lines
        continue-on-error: true

      - name: Build WebSocket Service binary
        run: |
          mkdir -p build 
          cd socket-service
          GOOS=linux GOARCH=amd64 go build -o ../build/socket-service .

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}

    steps:
      - name: Generate remote setup script
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
          REDIS_ADDRESS: ${{ vars.REDIS_ADDRESS }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ vars.REDIS_DB }}
          SERVER_GIN_MODE: release
        run: |
          cat > remote_setup.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          VERSION="$1"
          echo "==> Preparing deployment directories and configs..."
          sudo mkdir -p /opt/socket-service/{bin,config,migrations,logs}

          echo "==> Writing environment configs..."
          sudo tee /opt/socket-service/config/socket-service.env > /dev/null <<EON
          DATABASE_HOST='${POSTGRES_HOST}'
          DATABASE_PORT='${POSTGRES_PORT}'
          DATABASE_USER='${POSTGRES_USER}'
          DATABASE_PASSWORD='${POSTGRES_PASSWORD}'
          DATABASE_NAME='${POSTGRES_DB}'         
          JWT_SECRET='${JWT_SECRET}'
          EVENT_API_KEY='${EVENT_API_KEY}'
          REDIS_ADDRESS='${REDIS_ADDRESS}'
          REDIS_PASSWORD='${REDIS_PASSWORD}'
          REDIS_DB='${REDIS_DB}'
          SERVER_GIN_MODE='${SERVER_GIN_MODE}'
          EON
        
          sudo chown -R mmn:mmn /opt/socket-service
          sudo chmod 600 /opt/socket-service/config/socket-service.env

          echo "==> Deploying new socket-service binary to staging path..."
          sudo install -m 0755 /tmp/socket-service /opt/socket-service/bin/socket-service-${VERSION}

          echo "==> Deploying migrations for socket-service..."
          sudo rm -rf /opt/socket-service/migrations
          sudo mv /tmp/postgres-socket-service /opt/socket-service/migrations

          echo "==> Preparation complete!"
          EOF
          chmod +x remote_setup.sh

      - name: Copy artifacts & prepare remote
        run: |
          set -e
          echo "==> Copying binaries to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} build/socket-service ${{ vars.HOST_ALIAS }}:/tmp/socket-service
          
          echo "==> Copying migrations to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} -r socket-service/migrations ${{ vars.HOST_ALIAS }}:/tmp/postgres-socket-service/

          echo "==> Copying static config for socket-service..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} socket-service/config/config.yml ${{ vars.HOST_ALIAS }}:/tmp/socket-service-config.yml

          echo "==> Copying setup scripts to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} remote_setup.sh ${{ vars.HOST_ALIAS }}:/tmp/
          
      - name: Atomic swap + restart services
        env:
          LOGLEVEL: ${{ inputs.env == 'prod' && 'warn' || 'info' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ssh -i ${{vars.SSH_PRIVATE_KEY_PATH}} ${{vars.HOST_ALIAS}} <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          
          echo "Deploying version: ${VERSION}"
          bash /tmp/remote_setup.sh "${VERSION}"

          sudo mkdir -p /etc/mezon

          echo "Log level set to: $LOGLEVEL"

          sed \
            -e "s|level: \"info\"|level: \"$LOGLEVEL\"|g" \
            -e "s|output: \"stdout\"|output: \"file\"|g" \
            /tmp/socket-service-config.yml \
            | sudo tee /etc/mezon/socket-service-config.yml >/dev/null

          echo "==> Stopping services..."
          sudo systemctl stop socket-service || true

          echo "==> Atomically swapping to new binary..."
          sudo ln -sfn /opt/socket-service/bin/socket-service-${VERSION} /opt/socket-service/bin/socket-service
          
          sudo chmod +x /opt/socket-service/bin/socket-service-${VERSION}
          systemctl cat socket-service

          echo "==> Reloading and starting services..."
          sudo systemctl daemon-reload
          sudo systemctl start socket-service

          echo "==> Reloading Nginx..."
          sudo nginx -t && sudo systemctl reload nginx

          echo "==> Cleaning up temporary files..."
          rm -f /tmp/socket-service
          rm -f /tmp/socket-service-config.yml
          rm -f /tmp/remote_setup.sh
          rm -rf /tmp/postgres-socket-service
          
          echo "==> Activation complete!"
          EOF

      - name: Health check (PID based)
        run: |
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} '
            set -e

            for i in {1..30}; do
              PID=$(systemctl show socket-service -p MainPID --value || true)

              if [ "$PID" != "0" ] && kill -0 "$PID" 2>/dev/null; then
                echo "socket-service running with PID $PID"
                exit 0
              fi

              echo "Waiting for process PID..."
              sleep 3
            done

            echo "socket-service did not start"
            systemctl status socket-service --no-pager
            exit 1
          '