services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: indexer
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d indexer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  indexer-orchestrator:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    command: ["orchestrator"]
    depends_on:
      - postgres
      - indexer-migrate-postgres
    volumes:
      - ./indexer/configs:/app/configs:ro
    restart: unless-stopped

  indexer-api:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    command: ["api"]
    depends_on:
      - postgres
      - indexer-migrate-postgres
      - indexer-orchestrator
    ports:
      - "${INDEXER_API_PORT:-8080}:3000"
    volumes:
      - ./indexer/configs:/app/configs:ro
    restart: unless-stopped

  indexer-migrate-postgres:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    command: ["migrate-postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./indexer/configs:/app/configs:ro
      - ./indexer/internal/tools/postgres:/app/internal/tools/postgres:ro
    environment:
      - MIGRATIONS_PATH=file://app/internal/tools/postgres
      - STORAGE_MAIN_POSTGRES_HOST=postgres
      - STORAGE_MAIN_POSTGRES_PORT=5432
      - STORAGE_MAIN_POSTGRES_USERNAME=${POSTGRES_USER}
      - STORAGE_MAIN_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - STORAGE_MAIN_POSTGRES_DATABASE=${POSTGRES_DB}
      - STORAGE_MAIN_POSTGRES_SSLMODE=disable
    restart: "no"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_APP_API_URL: ${NEXT_PUBLIC_APP_API_URL:-http://localhost:8080}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_API_URL: ${NEXT_PUBLIC_APP_API_URL:-http://localhost:8080}
    depends_on:
      - indexer-api
    restart: unless-stopped

volumes:
  postgres_data:
