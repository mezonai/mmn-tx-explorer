name: Deploy Transaction Explorer Services

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "master"

jobs:
  build:
    runs-on: [self-hosted, Linux, mezon-runner]
    outputs:
      git_sha: ${{ steps.get_sha.outputs.git_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          check-latest: false

      - name: Build Index binary
        run: |
          mkdir -p build
          cd indexer
          GOOS=linux GOARCH=amd64 go build -o build/indexer .
      
      - name: Get short SHA
        id: get_sha
        run: echo "git_sha=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload Indexer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indexer-binary
          path: build/indexer

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/public
            frontend/package.json
            frontend/next.config.js

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}
    env:
      TARGET_HOST: ${{ inputs.env == 'prod' && 'prod-indexer' || 'dev-indexer' }}
      GIT_SHA: ${{ needs.build.outputs.git_sha }}

    steps:
      - name: Download indexer binary
        uses: actions/download-artifact@v4
        with:
          name: indexer-binary
          path: build

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/frontend

      - name: Generate remote setup script
        run: |
          cat > remote_setup.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SHA="$1"
          echo "==> Preparing deployment directories and configs..."
          sudo mkdir -p /opt/indexer/bin /opt/indexer/config /var/www/frontend
          
          echo "==> Writing environment configs..."
          sudo tee /opt/indexer/config/indexer.env > /dev/null <<'EON'
          STORAGE_MAIN_POSTGRES_HOST=${POSTGRES_HOST}
          STORAGE_MAIN_POSTGRES_PORT=${POSTGRES_PORT}
          STORAGE_MAIN_POSTGRES_USERNAME=${POSTGRES_USER}
          STORAGE_MAIN_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          STORAGE_MAIN_POSTGRES_DATABASE=${POSTGRES_DB}
          STORAGE_MAIN_POSTGRES_SSLMODE=disable
          MIGRATIONS_PATH=file://app/internal/tools/postgres
          EON

          sudo tee /var/www/frontend/.env.local > /dev/null <<'EON'
          NEXT_PUBLIC_INDEXER_API_URL=${NEXT_PUBLIC_INDEXER_API_URL}
          APP_API_URL_INTERNAL=${APP_API_URL_INTERNAL}
          EON

          sudo chown -R mmn:mmn /opt/indexer
          sudo chown -R mmn:mmn /var/www/frontend
          sudo chmod 600 /opt/indexer/config/indexer.env
          sudo chmod 644 /var/www/frontend/.env.local

          echo "==> Deploying new indexer binary to staging path..."
          sudo install -m 0755 /tmp/indexer /opt/indexer/bin/indexer-${SHA}
          
          echo "==> Running database migrations..."
          set -a
          source /opt/indexer/config/indexer.env
          set +a
          /opt/indexer/bin/indexer-${SHA} migrate-postgres

          echo "==> Preparation complete!"
          EOF
          chmod +x remote_setup.sh

      - name: Prepare and deploy to target server
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          NEXT_PUBLIC_INDEXER_API_URL: ${{ secrets.NEXT_PUBLIC_INDEXER_API_URL }}
          APP_API_URL_INTERNAL: ${{ secrets.APP_API_URL_INTERNAL }}
        run: |
          set -e
          echo "==> Compressing frontend build..."
          tar -czvf /tmp/frontend_build.tar.gz -C build/frontend .

          echo "==> Copying files to target server..."
          scp -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} build/indexer remote_setup.sh /tmp/frontend_build.tar.gz ${{ secrets.HOST_ALIAS }}:/tmp/

          echo "==> Running remote setup script..."
          ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} ${{ secrets.HOST_ALIAS }} "
            export POSTGRES_DB='${POSTGRES_DB}'
            export POSTGRES_USER='${POSTGRES_USER}'
            export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
            export POSTGRES_HOST='${POSTGRES_HOST}'
            export POSTGRES_PORT='${POSTGRES_PORT}'
            export NEXT_PUBLIC_INDEXER_API_URL='${NEXT_PUBLIC_INDEXER_API_URL}'
            export APP_API_URL_INTERNAL='${APP_API_URL_INTERNAL}'

            sudo bash /tmp/remote_setup.sh $GIT_SHA
            rm -f /tmp/indexer /tmp/remote_setup.sh
          "

      - name: Atomic swap + restart services
        run: |
          ssh -i ${{secrets.SSH_PRIVATE_KEY_PATH}} ${{secrets.HOST_ALIAS}} <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          echo "==> Stopping services..."
          sudo systemctl stop indexer-api || true
          sudo systemctl stop indexer-orchestrator || true
          sudo systemctl stop frontend || true

          echo "==> Atomically swapping to new indexer binary..."
          sudo ln -sfn indexer-${GIT_SHA} /opt/indexer/bin/indexer

          echo "==> Deploying new frontend build..."
          sudo rm -rf /var/www/frontend/.next
          sudo tar -xzvf /tmp/frontend_build.tar.gz -C /var/www/frontend
          sudo rm -f /tmp/frontend_build.tar.gz

          echo "==> Reloading and starting services..."
          sudo systemctl daemon-reload
          sudo systemctl start indexer-orchestrator
          sudo systemctl start indexer-api
          sudo systemctl start frontend

          echo "==> Activation complete!"
          EOF

      - name: Health check after deployment
        env:
          HOST_ALIAS: ${{ secrets.HOST_ALIAS }}
          SSH_PRIVATE_KEY_PATH: ${{ secrets.SSH_PRIVATE_KEY_PATH }}
        run: |
          echo "==> Checking API status..."
          ssh -i $SSH_PRIVATE_KEY_PATH $HOST_ALIAS "curl -sSf http://127.0.0.1:3000/health"

          echo "==> Checking Orchestrator status..."
          ssh -i $SSH_PRIVATE_KEY_PATH $HOST_ALIAS "systemctl is-active indexer-orchestrator"

          echo "==> Checking Frontend status..."
          ssh -i $SSH_PRIVATE_KEY_PATH $HOST_ALIAS "sudo systemctl is-active frontend"
