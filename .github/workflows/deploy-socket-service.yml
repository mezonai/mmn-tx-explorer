name: Deploy WebSocket Service
permissions:
  contents: write

on: 
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "main"
      target_tag:
        description: "(Optional) Existing tag to deploy (skips build)"
        required: false

  workflow_call:
    inputs:
      env:
        type: string
        required: true
      ref:
        type: string
        required: true
      mode:
        type: string
        required: true
      target_tag:
        type: string
        required: false
      source_tag:
        type: string
        required: false
    secrets:
      POSTGRES_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      EVENT_API_KEY:
        required: true
      REDIS_PASSWORD:
        required: true

jobs:
  build:
    if: inputs.mode != 'skip'
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
      asset_name: ${{ steps.meta.outputs.asset_name }}
      asset_path: ${{ steps.meta.outputs.asset_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: false
          fetch-depth: 1

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "redeploy" ]; then
            DEPLOY_TAG="${{ inputs.source_tag }}"
          else
            DEPLOY_TAG="${{ inputs.target_tag }}"
          fi
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "asset_name=socket-service-${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "asset_path=build/socket-service-${DEPLOY_TAG}" >> $GITHUB_OUTPUT   

      - name: Setup Go
        if: inputs.mode == 'build'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          check-latest: false
       
      - name: Run golangci-lint
        if: inputs.mode == 'build'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: socket-service
          args: --timeout=5m --output.text.print-issued-lines
        continue-on-error: true

      - name: Build Socket Service binary
        if: inputs.mode == 'build'
        id: build_socket_binary
        run: |
          mkdir -p build
          cd socket-service
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../${{ steps.meta.outputs.asset_path }} .

      - name: Download source asset for repackage
        if: inputs.mode == 'repackage'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          SRC_RELEASE="${{ inputs.source_tag }}"
          SRC_ASSET="socket-service-${{ inputs.source_tag }}"
          URL="https://github.com/$OWNER/$REPO/releases/download/$SRC_RELEASE/$SRC_ASSET"
          echo "Downloading $URL"
          curl -sSL --fail -o "${{ steps.meta.outputs.asset_path }}" "$URL"
          chmod +x "${{ steps.meta.outputs.asset_path }}"

      - name: Upload packaged asset for release
        if: inputs.mode == 'build' || inputs.mode == 'repackage'
        uses: actions/upload-artifact@v4
        with:
          name: socket-release-asset
          path: ${{ steps.meta.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload deploy asset
        if: inputs.mode == 'build' || inputs.mode == 'repackage'
        uses: actions/upload-artifact@v4
        with:
          name: socket-deploy-asset
          path: ${{ steps.meta.outputs.asset_path }}
          if-no-files-found: error

  deploy-socket:
    if: always()
    needs: build
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: false
          fetch-depth: 1

      - name: Download prepared asset
        if: inputs.mode == 'build' || inputs.mode == 'repackage'
        uses: actions/download-artifact@v4
        with:
          name: socket-deploy-asset
          path: build
          
      - name: Determine binary path and tag
        id: determine_binary
        run: |
          if [ "${{ inputs.mode }}" = "redeploy" ]; then
            TAG_TO_DEPLOY="${{ inputs.source_tag }}"
          else
            TAG_TO_DEPLOY="${{ inputs.target_tag }}"
          fi
          echo "tag_name=$TAG_TO_DEPLOY" >> $GITHUB_OUTPUT
          echo "binary_name=socket-service-$TAG_TO_DEPLOY" >> $GITHUB_OUTPUT
          echo "binary_path=build/socket-service-$TAG_TO_DEPLOY" >> $GITHUB_OUTPUT
      
      - name: Download release binary using url 
        if: inputs.mode == 'redeploy'
        run: | 
          set -euo pipefail
          
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          TAG_NAME="${{ inputs.source_tag }}"
          BINARY_NAME="socket-service-${{ inputs.source_tag }}"
          BINARY_PATH="build/socket-service-${{ inputs.source_tag }}"
          DOWNLOAD_URL="https://github.com/$OWNER/$REPO/releases/download/$TAG_NAME/$BINARY_NAME"
          
          echo "==> Downloading from URL: $DOWNLOAD_URL"
          mkdir -p build
          curl -sSL --fail -o "$BINARY_PATH" "$DOWNLOAD_URL"
          echo "==> Download complete: $BINARY_PATH"
          ls -lh "$BINARY_PATH"

      - name: Copy config to target
        run: |
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} socket-service/config/config.yml ${{ vars.HOST_ALIAS }}:/opt/socket-service/config/config.template.yml
       
      - name: Generate remote setup script
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
          REDIS_ADDRESS: ${{ vars.REDIS_ADDRESS }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ vars.REDIS_DB }}
          SERVER_GIN_MODE: release 
        run: |
          cat > remote_setup.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          VERSION_ID="$1"
          echo "==> Preparing deployment directories and configs..."
          sudo mkdir -p /opt/socket-service/{bin,config,migrations,logs}
          
          echo "==> Writing environment configs..."
          sudo tee /opt/socket-service/config/socket-service.env > /dev/null <<EON
          DATABASE_HOST='${POSTGRES_HOST}'
          DATABASE_PORT='${POSTGRES_PORT}'
          DATABASE_USER='${POSTGRES_USER}'
          DATABASE_PASSWORD='${POSTGRES_PASSWORD}'
          DATABASE_NAME='${POSTGRES_DB}'
          JWT_SECRET='${JWT_SECRET}'
          EVENT_API_KEY='${EVENT_API_KEY}'
          REDIS_ADDRESS='${REDIS_ADDRESS}'
          REDIS_PASSWORD='${REDIS_PASSWORD}'
          REDIS_DB='${REDIS_DB}'
          SERVER_GIN_MODE='${SERVER_GIN_MODE}'
          EON

          sudo chown -R mmn:mmn /opt/socket-service
          sudo chmod 600 /opt/socket-service/config/socket-service.env

          echo "==> Deploying new binary to staging path..."
          sudo install -m 0755 /tmp/socket-service /opt/socket-service/bin/socket-service-${VERSION_ID}

          echo "==> Deploying migrations..."
          sudo rm -rf /opt/socket-service/migrations
          sudo mv /tmp/postgres-socket /opt/socket-service/migrations

          echo "==> Preparation complete!"
          EOF
          chmod +x remote_setup.sh
          
           echo "# Remote env generated at $(date)" > remote_env.sh
          printf "export POSTGRES_DB=%q\n" "$POSTGRES_DB" >> remote_env.sh
          printf "export POSTGRES_USER=%q\n" "$POSTGRES_USER" >> remote_env.sh
          printf "export POSTGRES_PASSWORD=%q\n" "$POSTGRES_PASSWORD" >> remote_env.sh
          printf "export POSTGRES_HOST=%q\n" "$POSTGRES_HOST" >> remote_env.sh
          printf "export POSTGRES_PORT=%q\n" "$POSTGRES_PORT" >> remote_env.sh
          printf "export DATABASE_HOST=%q\n" "$POSTGRES_HOST" >> remote_env.sh
          printf "export DATABASE_PORT=%q\n" "$POSTGRES_PORT" >> remote_env.sh
          printf "export DATABASE_USER=%q\n" "$POSTGRES_USER" >> remote_env.sh
          printf "export DATABASE_PASSWORD=%q\n" "$POSTGRES_PASSWORD" >> remote_env.sh
          printf "export DATABASE_NAME=%q\n" "$POSTGRES_DB" >> remote_env.sh
          printf "export JWT_SECRET=%q\n" "$JWT_SECRET" >> remote_env.sh
          printf "export EVENT_API_KEY=%q\n" "$EVENT_API_KEY" >> remote_env.sh
          printf "export REDIS_ADDRESS=%q\n" "$REDIS_ADDRESS" >> remote_env.sh
          printf "export REDIS_PASSWORD=%q\n" "$REDIS_PASSWORD" >> remote_env.sh
          printf "export REDIS_DB=%q\n" "$REDIS_DB" >> remote_env.sh
          printf "export SERVER_GIN_MODE=%q\n" "$SERVER_GIN_MODE" >> remote_env.sh

      - name: Prepare and deploy to target server
        env:
          DEPLOY_TAG: ${{ steps.determine_binary.outputs.tag_name }}
          BINARY_PATH: ${{ steps.determine_binary.outputs.binary_path }}
        run: |
          set -e
          echo "==> Copying binaries to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} "$BINARY_PATH" ${{ vars.HOST_ALIAS }}:/tmp/socket-service
          
          echo "==> Copying migrations to target server..."
          # Note: Adjusted source path to match socket-service structure
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} -r socket-service/migrations ${{ vars.HOST_ALIAS }}:/tmp/postgres-socket/

          echo "==> Copying setup scripts to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} remote_setup.sh remote_env.sh ${{ vars.HOST_ALIAS }}:/tmp/

          echo "==> Running remote setup script..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "
            set -e
            source /tmp/remote_env.sh
            bash /tmp/remote_setup.sh \"$DEPLOY_TAG\"
            
            echo '==> Cleaning up temp files...'
            rm -f /tmp/socket-service
            rm -f /tmp/remote_setup.sh /tmp/remote_env.sh
            rm -rf /tmp/postgres-socket
          "

      - name: Atomic swap + restart services
        env:
          LOGLEVEL: ${{ inputs.env == 'prod' && 'warn' || 'info' }}
          DEPLOY_TAG: ${{ steps.determine_binary.outputs.tag_name }}
        run: |
          ssh -i ${{vars.SSH_PRIVATE_KEY_PATH}} ${{vars.HOST_ALIAS}} <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          echo "Log level set to: $LOGLEVEL"

          echo "==> Generating final config files on target server..."
          sudo mkdir -p /etc/mezon
          
          sed \
            -e "s|level: \"info\"|level: \"$LOGLEVEL\"|g" \
            -e "s|output: \"stdout\"|output: \"file\"|g" \
            -e "s|filePath: .*|filePath: /opt/socket-service/logs/socket-service.log|g" \
            /opt/socket-service/config/config.template.yml \
            | sudo tee /etc/mezon/socket-service-config.yml >/dev/null

          echo "==> Stopping services..."
          sudo systemctl stop socket-service || true

          echo "==> Atomically swapping to new binary..."
          sudo ln -sfn socket-service-${DEPLOY_TAG} /opt/socket-service/bin/socket-service

          echo "==> Running database migrations..."
          set -a
          source /opt/socket-service/config/socket-service.env
          set +a
          /opt/socket-service/bin/socket-service migrate || echo "Migration command skipped (check binary args)"

          echo "==> Reloading and starting services..."
          sudo systemctl daemon-reload
          sudo systemctl start socket-service

          echo "==> Reloading Nginx..."
          sudo nginx -t && sudo systemctl reload nginx

          echo "==> Activation complete!"
          EOF
          
      - name: Health check after deployment
        run: |
          echo "==> Checking Socket Service status..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "
            for i in {1..10}; do
              if curl -sSf http://127.0.0.1:8080/health; then
                exit 0
              fi
              sleep 2
            done
            systemctl status socket-service --no-pager
            exit 1
          "