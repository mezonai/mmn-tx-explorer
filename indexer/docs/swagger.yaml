definitions:
  api.Error:
    description: Error represents an API error response
    properties:
      code:
        description: '@Description HTTP status code'
        type: integer
      message:
        description: '@Description Error message'
        type: string
      support_id:
        description: '@Description Support ID for tracking the error'
        type: string
    type: object
  api.Meta:
    description: Meta represents metadata for a query response
    properties:
      address:
        description: '@Description Contract address'
        type: string
      chain_id:
        description: '@Description Chain ID of the blockchain'
        type: integer
      limit:
        description: '@Description Number of items per page'
        type: integer
      page:
        description: '@Description Current page number'
        type: integer
      signature:
        description: '@Description Function or event signature'
        type: string
      total_items:
        description: '@Description Total number of items'
        type: integer
      total_pages:
        description: '@Description Total number of pages'
        type: integer
    type: object
  api.QueryResponse:
    description: QueryResponse represents the response structure for a query
    properties:
      aggregations:
        description: '@Description Aggregation results'
        items:
          additionalProperties: true
          type: object
        type: array
      data:
        description: '@Description Query result data'
      meta:
        allOf:
        - $ref: '#/definitions/api.Meta'
        description: '@Description Metadata for the query response'
    type: object
  common.BlockModel:
    properties:
      block_hash:
        type: string
      block_number:
        type: integer
      block_timestamp:
        type: integer
      chain_id:
        type: string
      parent_hash:
        type: string
      transaction_count:
        type: integer
    type: object
  common.DecodedLogDataModel:
    properties:
      indexed_params:
        type: object
      name:
        type: string
      non_indexed_params:
        type: object
      signature:
        type: string
    type: object
  common.DecodedLogModel:
    properties:
      address:
        type: string
      block_hash:
        type: string
      block_number:
        type: integer
      block_timestamp:
        type: integer
      chain_id:
        type: string
      data:
        type: string
      decoded:
        $ref: '#/definitions/common.DecodedLogDataModel'
      log_index:
        type: integer
      topics:
        items:
          type: string
        type: array
      transaction_hash:
        type: string
      transaction_index:
        type: integer
    type: object
  common.DecodedTransactionDataModel:
    properties:
      inputs:
        additionalProperties: true
        type: object
      name:
        type: string
      signature:
        type: string
    type: object
  common.DecodedTransactionModel:
    properties:
      block_hash:
        type: string
      block_number:
        type: integer
      chain_id:
        type: string
      decoded:
        $ref: '#/definitions/common.DecodedTransactionDataModel'
      extra_info:
        type: string
      from_address:
        type: string
      hash:
        type: string
      nonce:
        type: integer
      status:
        type: integer
      text_data:
        type: string
      to_address:
        type: string
      transaction_timestamp:
        type: integer
      transaction_type:
        type: integer
      value:
        type: string
    type: object
  common.LogModel:
    properties:
      address:
        type: string
      block_hash:
        type: string
      block_number:
        type: integer
      block_timestamp:
        type: integer
      chain_id:
        type: string
      data:
        type: string
      log_index:
        type: integer
      topics:
        items:
          type: string
        type: array
      transaction_hash:
        type: string
      transaction_index:
        type: integer
    type: object
  common.TransactionModel:
    properties:
      block_hash:
        type: string
      block_number:
        type: integer
      chain_id:
        type: string
      extra_info:
        type: string
      from_address:
        type: string
      hash:
        type: string
      nonce:
        type: integer
      status:
        type: integer
      text_data:
        type: string
      to_address:
        type: string
      transaction_timestamp:
        type: integer
      transaction_type:
        type: integer
      value:
        type: string
    type: object
  handlers.BalanceModel:
    properties:
      balance:
        type: string
      token_address:
        type: string
      token_id:
        type: string
      token_type:
        type: string
    type: object
  handlers.BlockDetailResponse:
    properties:
      data:
        properties:
          block:
            $ref: '#/definitions/common.BlockModel'
        type: object
    type: object
  handlers.HolderModel:
    properties:
      balance:
        type: string
      holder_address:
        type: string
      token_id:
        type: string
      token_type:
        type: string
    type: object
  handlers.PendingTransactionModel:
    properties:
      from_address:
        type: string
      hash:
        type: string
      nonce:
        type: integer
      status:
        type: integer
      to_address:
        type: string
      transaction_timestamp:
        type: integer
      transaction_type:
        type: integer
      value:
        type: string
    type: object
  handlers.SearchResultModel:
    properties:
      blocks:
        items:
          $ref: '#/definitions/common.BlockModel'
        type: array
      events:
        items:
          $ref: '#/definitions/common.LogModel'
        type: array
      transactions:
        items:
          $ref: '#/definitions/common.TransactionModel'
        type: array
      type:
        $ref: '#/definitions/handlers.SearchResultType'
      wallets:
        items:
          additionalProperties: true
          type: object
        type: array
    type: object
  handlers.SearchResultType:
    enum:
    - block
    - transaction
    - event_signature
    - function_signature
    - address
    - contract
    - wallet
    type: string
    x-enum-varnames:
    - SearchResultTypeBlock
    - SearchResultTypeTransaction
    - SearchResultTypeEventSignature
    - SearchResultTypeFunctionSignature
    - SearchResultTypeAddress
    - SearchResultTypeContract
    - SearchResultTypeWallet
  handlers.TokenIdModel:
    properties:
      token_id:
        type: string
      token_type:
        type: string
    type: object
  handlers.TransactionDetailResponse:
    properties:
      data:
        properties:
          transaction:
            $ref: '#/definitions/common.TransactionModel'
        type: object
    type: object
  handlers.TransferModel:
    properties:
      amount:
        type: string
      block_number:
        type: string
      block_timestamp:
        type: string
      from_address:
        type: string
      log_index:
        type: integer
      to_address:
        type: string
      token_address:
        type: string
      token_id:
        type: string
      token_type:
        type: string
      transaction_hash:
        type: string
    type: object
  handlers.WalletDetailResponse:
    properties:
      data:
        additionalProperties: true
        type: object
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for indexing blockchain data.
