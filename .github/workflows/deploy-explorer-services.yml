name: Deploy Transaction Explorer Services
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        type: choice
        options: [dev, prod]
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "main"
      build_all:
        description: "Force build all"
        required: false
        type: boolean
        default: false
      rebuild_existing_tag:
        description: "(Optional) Existing tag to rebuild"
        required: false
        type: string
      new_tag_to_build:
        description: "(Optional) New tag "
        required: false

jobs:
  determine_tags:
    runs-on: [self-hosted, Linux, mezon-runner]
    outputs:
      release_tag: ${{ steps.tags.outputs.release_tag }}
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
      indexer_tag: ${{ steps.tags.outputs.indexer_tag }}
      socket_tag: ${{ steps.tags.outputs.socket_tag }}
      dong_tag: ${{ steps.tags.outputs.dong_tag }}

      build_frontend: ${{ steps.detect.outputs.frontend }}
      build_dong: ${{ steps.detect.outputs.dong }}
      build_socket: ${{ steps.detect.outputs.socket }}
      build_indexer: ${{ steps.detect.outputs.indexer }}

      should_release: ${{ steps.tags.outputs.should_release }}
    steps:
      - name: Checkout for git history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }} 
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          set -e

          if [ "${{ inputs.build_all }}" = "true" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "dong=true" >> $GITHUB_OUTPUT
            echo "socket=true" >> $GITHUB_OUTPUT
            echo "indexer=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "${{ inputs.rebuild_existing_tag }}" ] || [ -n "${{ inputs.new_tag_to_build }}" ]; then
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "dong=false" >> $GITHUB_OUTPUT
            echo "socket=false" >> $GITHUB_OUTPUT
            echo "indexer=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ inputs.env }}" = "dev" ]; then
            BASE_BRANCH="origin/develop"
            git fetch origin develop
          elif [ "${{ inputs.env }}" = "prod" ]; then
            BASE_BRANCH="origin/main"
            git fetch origin main
          else
            echo "Invalid env input"
            exit 1
          fi

          detect() {
            local service=$1
              if git diff --quiet "$BASE_BRANCH..HEAD" -- "$service/"; then
              echo false
            else
              echo true
            fi
          }

          echo "frontend=$(detect frontend)" >> $GITHUB_OUTPUT
          echo "dong=$(detect dong-service)" >> $GITHUB_OUTPUT
          echo "socket=$(detect socket-service)" >> $GITHUB_OUTPUT
          echo "indexer=$(detect indexer)" >> $GITHUB_OUTPUT

      - name: Calculate tags
        id: tags
        run: |
          set -e
          git fetch --tags --force

          normalize() {
            [[ "$1" == v* ]] && echo "$1" || echo "v$1"
          }
          latest_service_tag() {
            local SERVICE=$1
            git tag -l "${SERVICE}-v*" --sort=-v:refname | head -n1
          }
          latest_release_tag() {
            git tag -l "release-v*" --sort=-v:refname | head -n1
          }
          latest_global_tag() {
            git tag -l "v*" --sort=-v:refname | head -n1
          }
          increment() {
            local VERSION=${1#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH+1))
            echo "v${MAJOR}.${MINOR}.${PATCH}"
          }

          bump_service() {
            local SERVICE=$1
            local SERVICE_TAG=$(latest_service_tag "$SERVICE")
            local RELEASE_TAG=$(latest_release_tag)
            local BASE_VERSION=""

            if [ -z "$BASE_VERSION" ]; then
                BASE_VERSION="v0.0.0"
            fi
            if [ -n "$SERVICE_TAG" ]; then
              BASE_VERSION=${SERVICE_TAG#${SERVICE}-}
            fi 
            if [ -n "$RELEASE_TAG" ]; then
              REL_VER=${RELEASE_TAG#release-}
              HIGHER=$(echo -e "${BASE_VERSION#v}\n${REL_VER#v}" | sort -V | tail -n1)
              BASE_VERSION="v$HIGHER"
            fi

            NEW_VERSION=$(increment "$BASE_VERSION")
            echo "${SERVICE}-${NEW_VERSION}"
          }
          bump_release() {
            local LATEST=$(latest_release_tag)
            if [ -z "$LATEST" ]; then
              echo "release-v0.1.0"
            else
              VERSION=${LATEST#release-}
              NEW_VERSION=$(increment "$VERSION")
              echo "release-${NEW_VERSION}"
            fi
          }

          if [ -n "${{ inputs.new_tag_to_build }}" ]; then
            RAW=$(normalize "${{ inputs.new_tag_to_build }}")
            if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format. Must be vX.Y.Z"
              exit 1
            fi

            RELEASE="release-${RAW}"
            FRONTEND="frontend-${RAW}"
            DONG="dong-service-${RAW}"
            SOCKET="socket-service-${RAW}"
            INDEXER="indexer-${RAW}"

            SHOULD=true
          elif [ -n "${{ inputs.rebuild_existing_tag }}" ]; then
            RELEASE=$(normalize "${{ inputs.rebuild_existing_tag }}")
            [[ "$RELEASE" != release-* ]] && RELEASE="release-$RELEASE"

            BODY=$(gh release view "$RELEASE" --json body -q '.body' || echo "")
            FRONTEND=$(echo "$BODY" | grep "Frontend:" | awk '{print $2}' | xargs)
            DONG=$(echo "$BODY" | grep "Dong:" | awk '{print $2}' | xargs)
            SOCKET=$(echo "$BODY" | grep "Socket:" | awk '{print $2}' | xargs)
            INDEXER=$(echo "$BODY" | grep "Indexer:" | awk '{print $2}' | xargs)
            
            echo "mode=redeploy" >> $GITHUB_OUTPUT
            SHOULD=true
          else
            BUILT=false

            resolve_existing() {
              local SERVICE=$1
              local SERVICE_TAG=$(latest_service_tag "$SERVICE")

              if [ -n "$SERVICE_TAG" ]; then
                echo "$SERVICE_TAG"
                return
              fi

              GLOBAL_TAG=$(latest_global_tag)
              if [ -n "$GLOBAL_TAG" ]; then
                echo "${SERVICE}-${GLOBAL_TAG}"
              else
                echo "${SERVICE}-v0.0.0"
              fi
            }

            if [ "${{ steps.detect.outputs.frontend }}" = "true" ]; then
              FRONTEND=$(bump_service frontend)
              BUILT=true
            else
              FRONTEND=$(resolve_existing frontend)
            fi
            if [ "${{ steps.detect.outputs.dong }}" = "true" ]; then
              DONG=$(bump_service dong-service)
              BUILT=true
            else  
              DONG=$(resolve_existing dong-service) 
            fi
            if [ "${{ steps.detect.outputs.socket }}" = "true" ]; then
              SOCKET=$(bump_service socket-service)
              BUILT=true
            else
              SOCKET=$(resolve_existing socket-service)
            fi
            if [ "${{ steps.detect.outputs.indexer }}" = "true" ]; then
              INDEXER=$(bump_service indexer)
              BUILT=true
            else
              INDEXER=$(resolve_existing indexer)
            fi

            if [ "$BUILT" = "true" ]; then
              RELEASE=$(bump_release)
              SHOULD=true
            else
              RELEASE=$(latest_release_tag)
              SHOULD=false
            fi
          fi

          echo "release_tag=$RELEASE" >> $GITHUB_OUTPUT
          echo "frontend_tag=$FRONTEND" >> $GITHUB_OUTPUT
          echo "dong_tag=$DONG" >> $GITHUB_OUTPUT
          echo "socket_tag=$SOCKET" >> $GITHUB_OUTPUT
          echo "indexer_tag=$INDEXER" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD" >> $GITHUB_OUTPUT
    
      - name: Push Service Tags for Tracking
        if: steps.tags.outputs.should_release == 'true'
        run: |    
          git tag -f "${{ steps.tags.outputs.release_tag }}"
          
          SERVICES=("frontend" "dong" "socket" "indexer")
          for svc in "${SERVICES[@]}"; do
            VAR_NAME=$(echo "${svc}_TAG" | tr '[:lower:]' '[:upper:]')
            TAG_VAL="${!VAR_NAME}"
            
            IS_CHANGED_VAR=$(echo "${svc}_CHANGED" | tr '[:lower:]' '[:upper:]')
            IS_CHANGED="${!IS_CHANGED_VAR}"

            if [ -n "${{ inputs.new_tag_to_build }}" ] || \
               [ -n "${{ inputs.rebuild_existing_tag }}" ] || \
               [ "${{ inputs.build_all }}" = "true" ] || \
               [ "$IS_CHANGED" = "true" ]; then
              echo "Creating tracking tag for $svc: $TAG_VAL"
              git tag -f "$TAG_VAL"
            fi
          done

          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_TAG: ${{ steps.tags.outputs.frontend_tag }}
          DONG_TAG: ${{ steps.tags.outputs.dong_tag }}
          SOCKET_TAG: ${{ steps.tags.outputs.socket_tag }}
          INDEXER_TAG: ${{ steps.tags.outputs.indexer_tag }}

          FRONTEND_CHANGED: ${{ steps.detect.outputs.frontend }}
          DONG_CHANGED: ${{ steps.detect.outputs.dong }}
          SOCKET_CHANGED: ${{ steps.detect.outputs.socket }}
          INDEXER_CHANGED: ${{ steps.detect.outputs.indexer }}

  prepare_assets:
    needs: [determine_tags]
    if: inputs.new_tag_to_build != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Repackage Assets from Previous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ inputs.new_tag_to_build }}
          ENV: ${{ inputs.env }}
        run: |
          set -e

          LATEST_RELEASE_TAG=$(git tag -l "release-v*" --sort=-v:refname | head -n1)          
          echo "Latest release found: $LATEST_RELEASE_TAG"

          mkdir -p temp_assets final_assets          
          gh release download "$LATEST_RELEASE_TAG" --dir temp_assets
          
          cd temp_assets
          for file in *; do
            [[ "$file" == "checksums.txt" ]] && continue
   
            SERVICE_NAME_PART=$(echo "$file" | sed 's/-v[0-9].*//')
            CLEAN_VERSION=$(echo "${NEW_TAG}" | sed 's/^v//')

            if [[ "$file" == frontend-build-* ]]; then
              NEW_FILE="frontend-build-v${CLEAN_VERSION}-${ENV}.tar.gz"
              cp "$file" "../final_assets/$NEW_FILE"
            else
              NEW_FILE="${SERVICE_NAME_PART}-v${CLEAN_VERSION}"
              cp "$file" "../final_assets/$NEW_FILE"
            fi
          done

      - name: Upload Repackaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-repackaged-assets
          path: final_assets/*
        
  deploy-indexer:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_indexer == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-indexer-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }}
      service_tag: ${{ needs.determine_tags.outputs.indexer_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}

  deploy-dong:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_dong == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-dong-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }} 
      service_tag: ${{ needs.determine_tags.outputs.dong_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
      VERIFYING_KEY_B64: ${{ secrets.VERIFYING_KEY_B64 }}
 
  deploy-frontend:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_frontend == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-frontend-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }} 
      service_tag: ${{ needs.determine_tags.outputs.frontend_tag }}
    secrets:
      NEXT_PUBLIC_COBAR_API_KEY: ${{ secrets.NEXT_PUBLIC_COBAR_API_KEY }}
      NEXT_PUBLIC_MEZON_SERVER_KEY: ${{ secrets.NEXT_PUBLIC_MEZON_SERVER_KEY }}

  deploy-socket:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_socket == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-socket-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }} 
      service_tag: ${{ needs.determine_tags.outputs.socket_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

  create_release:
    needs: [determine_tags, prepare_assets, deploy-indexer, deploy-dong, deploy-frontend, deploy-socket]
    runs-on: ubuntu-latest
    if: |
        always() && 
        needs.determine_tags.result == 'success' && 
        needs.determine_tags.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create Workspace
        run: mkdir -p release-assets

      - name: Download Build Artifacts
        if: inputs.new_tag_to_build == ''
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
        continue-on-error: true

      - name: Download Repackaged Artifacts
        if: inputs.new_tag_to_build != ''
        uses: actions/download-artifact@v4
        with:
          name: manual-repackaged-assets
          path: release-assets

      - name: Backfill Missing Assets from Previous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LATEST_RELEASE_ON_GH=$(gh release list --limit 1 --exclude-drafts | awk '{print $3}')
          echo "Syncing missing assets from: $LATEST_RELEASE_ON_GH"

          SERVICES=("frontend" "dong-service" "socket-service" "indexer")
          for service in "${SERVICES[@]}"; do
            if ! ls release-assets/$service-* 1> /dev/null 2>&1; then
              echo "$service was not built. Downloading from $LATEST_RELEASE_ON_GH..."
              gh release download "$LATEST_RELEASE_ON_GH" --pattern "$service-*" --dir release-assets/ || echo "Warning: No old asset found for $service"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine_tags.outputs.release_tag }}
          name: Release ${{ needs.determine_tags.outputs.release_tag }}
          overwrite: true
          body: |
            Frontend: ${{ needs.determine_tags.outputs.frontend_tag }}
            Dong: ${{ needs.determine_tags.outputs.dong_tag }}
            Socket: ${{ needs.determine_tags.outputs.socket_tag }}
            Indexer: ${{ needs.determine_tags.outputs.indexer_tag }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}