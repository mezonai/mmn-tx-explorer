name: Deploy Transaction Explorer Services

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "master"

jobs:
  build:
    runs-on: [self-hosted, Linux, mezon-runner]
    outputs:
      git_sha: ${{ steps.get_sha.outputs.git_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          check-latest: false

      - name: Build Index binary
        run: |
          mkdir -p build
          cd indexer
          GOOS=linux GOARCH=amd64 go build -o build/indexer .
      
      - name: Get short SHA
        id: get_sha
        run: echo "git_sha=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          sudo ls -la .
          sudo ls -la .next
          cd ..

      - name: Stage Frontend Artifacts
        run: |
          mkdir -p build/frontend-stage/static
          mkdir -p build/frontend-stage/public
          mkdir -p build/frontend-stage/standalone

          cp -r frontend/.next/static/. build/frontend-stage/static/
          cp -r frontend/public/. build/frontend-stage/public/
          cp -r frontend/.next/standalone/. build/frontend-stage/standalone/ 

      - name: Upload Indexer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indexer-binary
          path: indexer/build/indexer

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/frontend-stage/

      - name: Upload Migration Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: migrations-postgres
          path: indexer/internal/tools/postgres

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}
    env:
      TARGET_HOST: ${{ inputs.env == 'prod' && 'prod-indexer' || 'dev-indexer' }}
      GIT_SHA: ${{ needs.build.outputs.git_sha }}

    steps:
      - name: Copy config and secrets to target
        run: |
          scp -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} indexer/configs/config.example.yml ${{ secrets.HOST_ALIAS }}:/opt/mezon/explorer/config/
          scp -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} indexer/configs/secrets.example.yml ${{ secrets.HOST_ALIAS }}:/opt/mezon/explorer/config/

      - name: Download indexer binary
        uses: actions/download-artifact@v4
        with:
          name: indexer-binary
          path: build

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/frontend

      - name: Download postgres migrations
        uses: actions/download-artifact@v4
        with:
          name: migrations-postgres
          path: build/migrations/postgres

      - name: Generate remote setup script
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          NEXT_PUBLIC_APP_API_URL: ${{ secrets.NEXT_PUBLIC_APP_API_URL }}
          APP_API_URL_INTERNAL: ${{ secrets.APP_API_URL_INTERNAL }}
        run: |
          cat > remote_setup.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SHA="$1"
          echo "==> Preparing deployment directories and configs..."
          sudo mkdir -p /opt/indexer/bin /opt/indexer/config /opt/indexer/migrations /opt/indexer/logs
          
          echo "==> Writing environment configs..."
          sudo tee /opt/indexer/config/indexer.env > /dev/null <<EON
          STORAGE_MAIN_POSTGRES_HOST=${POSTGRES_HOST}
          STORAGE_MAIN_POSTGRES_PORT=${POSTGRES_PORT}
          STORAGE_MAIN_POSTGRES_USERNAME=${POSTGRES_USER}
          STORAGE_MAIN_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          STORAGE_MAIN_POSTGRES_DATABASE=${POSTGRES_DB}
          STORAGE_MAIN_POSTGRES_SSLMODE=disable
          MIGRATIONS_PATH=/opt/indexer/migrations/postgres
          EON

          sudo chown -R mmn:mmn /opt/indexer
          sudo chown -R mmn:mmn /opt/indexer
          sudo chmod 600 /opt/indexer/config/indexer.env

          echo "==> Deploying new indexer binary to staging path..."
          sudo install -m 0755 /tmp/indexer /opt/indexer/bin/indexer-${SHA}

          echo "==> Deploying migrations..."
          sudo rm -rf /opt/indexer/migrations/postgres
          sudo mv /tmp/postgres /opt/indexer/migrations/

          echo "==> Preparation complete!"
          EOF
          chmod +x remote_setup.sh

          echo "# Explorer env generated at $(date)" > explorer_env.sh
          printf "export POSTGRES_DB=%q\n" "$POSTGRES_DB" >> explorer_env.sh
          printf "export POSTGRES_USER=%q\n" "$POSTGRES_USER" >> explorer_env.sh
          printf "export POSTGRES_PASSWORD=%q\n" "$POSTGRES_PASSWORD" >> explorer_env.sh
          printf "export POSTGRES_HOST=%q\n" "$POSTGRES_HOST" >> explorer_env.sh
          printf "export POSTGRES_PORT=%q\n" "$POSTGRES_PORT" >> explorer_env.sh
          printf "export NEXT_PUBLIC_APP_API_URL=%q\n" "$NEXT_PUBLIC_APP_API_URL" >> explorer_env.sh
          printf "export APP_API_URL_INTERNAL=%q\n" "$APP_API_URL_INTERNAL" >> explorer_env.sh
          echo "==> Generated explorer_env.sh"

      - name: Prepare and deploy to target server
        run: |
          set -e

          echo "==> Copying files to target server..."
          scp -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} -r build/migrations/postgres ${{ secrets.HOST_ALIAS }}:/tmp/
          scp -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} build/indexer remote_setup.sh explorer_env.sh ${{ secrets.HOST_ALIAS }}:/tmp/

          echo "==> Copying Next.js standalone build to target..."
          ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} ${{ secrets.HOST_ALIAS }} "
            sudo mkdir -p /opt/frontend /opt/frontend/.next /opt/frontend/public; 
            sudo chown -R mmn:mmn /opt/frontend
          "

          rsync -avz --delete -q -e "ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }}" build/frontend/standalone/ ${{ secrets.HOST_ALIAS }}:/opt/frontend/
          rsync -avz --delete -q -e "ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }}" build/frontend/static/ ${{ secrets.HOST_ALIAS }}:/opt/frontend/.next/static/
          rsync -avz --delete -q -e "ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }}" build/frontend/public/ ${{ secrets.HOST_ALIAS }}:/opt/frontend/public/
          
          ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} ${{ secrets.HOST_ALIAS }} "sudo chmod +x /opt/frontend/server.js"

          echo "==> Running remote setup script..."
          ssh -i ${{ secrets.SSH_PRIVATE_KEY_PATH }} ${{ secrets.HOST_ALIAS }} "
            set -e
            bash -c 'source /tmp/explorer_env.sh; bash /tmp/remote_setup.sh \"$GIT_SHA\"'
            rm -f /tmp/indexer /tmp/remote_setup.sh /tmp/explorer_env.sh
          "

      - name: Atomic swap + restart services
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          MMN_GRPC_URL: ${{ secrets.MMN_GRPC_URL }}
          GIT_SHA: ${{ needs.build.outputs.git_sha }}
        run: |
          ssh -i ${{secrets.SSH_PRIVATE_KEY_PATH}} ${{secrets.HOST_ALIAS}} <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          echo "==> Generating final config files on target server..."
          sudo mkdir -p /etc/mezon
          sed \
            -e "s|__POSTGRES_DB__|$POSTGRES_DB|g" \
            -e "s|__POSTGRES_USER__|$POSTGRES_USER|g" \
            -e "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" \
            -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
            -e "s|__POSTGRES_PORT__|$POSTGRES_PORT|g" \
            -e "s|__MMN_GRPC_URL__|$MMN_GRPC_URL|g" \
            /opt/mezon/explorer/config/config.example.yml \
            | sudo tee /etc/mezon/config.yml >/dev/null

          sed \
            -e "s|__POSTGRES_DB__|$POSTGRES_DB|g" \
            -e "s|__POSTGRES_USER__|$POSTGRES_USER|g" \
            -e "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" \
            -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
            -e "s|__POSTGRES_PORT__|$POSTGRES_PORT|g" \
            -e "s|__MMN_GRPC_URL__|$MMN_GRPC_URL|g" \
            /opt/mezon/explorer/config/secrets.example.yml \
            | sudo tee /etc/mezon/secrets.yml >/dev/null

          echo "==> Stopping services..."
          sudo systemctl stop indexer-api || true
          sudo systemctl stop indexer-orchestrator || true

          echo "==> Atomically swapping to new indexer binary..."
          sudo ln -sfn indexer-${GIT_SHA} /opt/indexer/bin/indexer

          echo "==> Running database migrations..."
          set -a
          source /opt/indexer/config/indexer.env
          set +a
          /opt/indexer/bin/indexer migrate-postgres

          echo "==> Reloading and starting services..."
          sudo systemctl daemon-reload
          sudo systemctl start indexer-orchestrator
          sudo systemctl start indexer-api

          echo "==> Reloading Nginx..."
          sudo nginx -t && sudo systemctl reload nginx

          echo "==> Activation complete!"
          EOF

      - name: Health check after deployment
        env:
          HOST_ALIAS: ${{ secrets.HOST_ALIAS }}
          SSH_PRIVATE_KEY_PATH: ${{ secrets.SSH_PRIVATE_KEY_PATH }}
        run: |
          echo "==> Checking API status..."
          ssh -i $SSH_PRIVATE_KEY_PATH $HOST_ALIAS "curl -sSf http://127.0.0.1:8080/health"

          echo "==> Checking Orchestrator status..."
          ssh -i $SSH_PRIVATE_KEY_PATH $HOST_ALIAS "systemctl is-active indexer-orchestrator"
          
          echo "==> Checking Frontend status..."
          ssh -i $SSH_PRIVATE_KEY_PATH $HOST_ALIAS "curl -sSf https://dev-mmn.nccsoft.vn/ > /dev/null"