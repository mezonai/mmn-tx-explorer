name: Deploy Transaction Explorer Services
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        type: choice
        options: [dev, prod]
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "main"
      new_tag_to_build:
        description: "(Optional) New tag"
        required: false
        type: string

      build_frontend:
        description: "Build Frontend"
        type: boolean
        default: false
      redeploy_frontend_tag:
        description: "(Optional) Frontend version"
        required: false
        type: string

      build_dong:
        description: "Build Dong"
        type: boolean
        default: false
      redeploy_dong_tag:
        description: "(Optional) Dong version"
        required: false
        type: string

      build_indexer:
        description: "Build Indexer"
        type: boolean
        default: false
      redeploy_indexer_tag:
        description: "(Optional) Indexer version"
        required: false
        type: string

      build_socket:
        description: "Build WebSocket"
        type: boolean
        default: false
      redeploy_socket_tag:
        description: "(Optional) Socket version"
        required: false
        type: string


jobs:
  determine_tags:
    runs-on: [self-hosted, Linux, mezon-runner]
    outputs:
      target_tag: ${{ steps.plan.outputs.target_tag }}
      should_release: ${{ steps.plan.outputs.should_release }}

      frontend_mode: ${{ steps.plan.outputs.frontend_mode }}
      dong_mode: ${{ steps.plan.outputs.dong_mode }}
      indexer_mode: ${{ steps.plan.outputs.indexer_mode }}
      socket_mode: ${{ steps.plan.outputs.socket_mode }}

      frontend_source_tag: ${{ steps.plan.outputs.frontend_source_tag }}
      dong_source_tag: ${{ steps.plan.outputs.dong_source_tag }}
      indexer_source_tag: ${{ steps.plan.outputs.indexer_source_tag }}
      socket_source_tag: ${{ steps.plan.outputs.socket_source_tag }}

      frontend_effective_tag: ${{ steps.state.outputs.frontend_effective_tag }}
      dong_effective_tag: ${{ steps.state.outputs.dong_effective_tag }}
      indexer_effective_tag: ${{ steps.state.outputs.indexer_effective_tag }}
      socket_effective_tag: ${{ steps.state.outputs.socket_effective_tag }}
    steps:
      - name: Checkout for git history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }} 
          fetch-depth: 0

      - name: Calculate plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          normalize_version() {
            local raw="$1"
            raw="$(echo "$raw" | xargs)"
            if [ -z "$raw" ]; then
              echo ""
            elif echo "$raw" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "$raw"
            elif echo "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "v$raw"
            else
              echo "Invalid version: $raw. Use v1.3.4 or 1.3.4" >&2
              exit 1
            fi
          }

          calc_next_tag() {
            local latest
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              echo "v0.1.0"
              return
            fi
            local version=${latest#v}

            version=${version#v}
            local major minor patch
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            patch=$((patch + 1))
            echo "v${major}.${minor}.${patch}"
          }

          resolve_mode() {
            local build_flag="$1"
            local source_tag="$2"
            if [ "$build_flag" = "true" ] && [ -n "$source_tag" ]; then
              echo "repackage"
            elif [ "$build_flag" = "true" ]; then
              echo "build"
            elif [ -n "$source_tag" ]; then
              echo "redeploy"
            else
              echo "skip"
            fi
          }

          FRONTEND_SOURCE_TAG=$(normalize_version "${{ inputs.redeploy_frontend_tag }}")
          DONG_SOURCE_TAG=$(normalize_version "${{ inputs.redeploy_dong_tag }}")
          INDEXER_SOURCE_TAG=$(normalize_version "${{ inputs.redeploy_indexer_tag }}")
          SOCKET_SOURCE_TAG=$(normalize_version "${{ inputs.redeploy_socket_tag }}")

          FRONTEND_MODE=$(resolve_mode "${{ inputs.build_frontend }}" "$FRONTEND_SOURCE_TAG")
          DONG_MODE=$(resolve_mode "${{ inputs.build_dong }}" "$DONG_SOURCE_TAG")
          INDEXER_MODE=$(resolve_mode "${{ inputs.build_indexer }}" "$INDEXER_SOURCE_TAG")
          SOCKET_MODE=$(resolve_mode "${{ inputs.build_socket }}" "$SOCKET_SOURCE_TAG")

          SHOULD_RELEASE=false
          if [ "$FRONTEND_MODE" = "build" ] || [ "$FRONTEND_MODE" = "repackage" ] || \
             [ "$DONG_MODE" = "build" ] || [ "$DONG_MODE" = "repackage" ] || \
             [ "$INDEXER_MODE" = "build" ] || [ "$INDEXER_MODE" = "repackage" ] || \
             [ "$SOCKET_MODE" = "build" ] || [ "$SOCKET_MODE" = "repackage" ]; then
            SHOULD_RELEASE=true
          fi

          if [ "$SHOULD_RELEASE" = "true" ]; then
            if [ -n "${{ inputs.new_tag_to_build }}" ]; then
              TARGET_TAG=$(normalize_version "${{ inputs.new_tag_to_build }}")
            else
              TARGET_TAG=$(calc_next_tag)
            fi
          else
            TARGET_TAG=""
          fi

          if [ "$FRONTEND_MODE" = "skip" ] && [ "$DONG_MODE" = "skip" ] && [ "$INDEXER_MODE" = "skip" ] && [ "$SOCKET_MODE" = "skip" ]; then
            echo "No services selected for build/redeploy." >&2
            exit 1
          fi

          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

          echo "frontend_mode=$FRONTEND_MODE" >> $GITHUB_OUTPUT
          echo "dong_mode=$DONG_MODE" >> $GITHUB_OUTPUT
          echo "indexer_mode=$INDEXER_MODE" >> $GITHUB_OUTPUT
          echo "socket_mode=$SOCKET_MODE" >> $GITHUB_OUTPUT

          echo "frontend_source_tag=$FRONTEND_SOURCE_TAG" >> $GITHUB_OUTPUT
          echo "dong_source_tag=$DONG_SOURCE_TAG" >> $GITHUB_OUTPUT
          echo "indexer_source_tag=$INDEXER_SOURCE_TAG" >> $GITHUB_OUTPUT
          echo "socket_source_tag=$SOCKET_SOURCE_TAG" >> $GITHUB_OUTPUT

          echo "Frontend => $FRONTEND_MODE (source=$FRONTEND_SOURCE_TAG)"
          echo "Dong => $DONG_MODE (source=$DONG_SOURCE_TAG)"
          echo "Indexer => $INDEXER_MODE (source=$INDEXER_SOURCE_TAG)"
          echo "Socket => $SOCKET_MODE (source=$SOCKET_SOURCE_TAG)"
          echo "Target release => ${TARGET_TAG:-<none>}"

      - name: Load and update service state
        id: state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_MODE: ${{ steps.plan.outputs.frontend_mode }}
          DONG_MODE: ${{ steps.plan.outputs.dong_mode }}
          INDEXER_MODE: ${{ steps.plan.outputs.indexer_mode }}
          SOCKET_MODE: ${{ steps.plan.outputs.socket_mode }}
          TARGET_TAG: ${{ steps.plan.outputs.target_tag }}
          FRONTEND_SOURCE_TAG: ${{ steps.plan.outputs.frontend_source_tag }}
          DONG_SOURCE_TAG: ${{ steps.plan.outputs.dong_source_tag }}
          INDEXER_SOURCE_TAG: ${{ steps.plan.outputs.indexer_source_tag }}
          SOCKET_SOURCE_TAG: ${{ steps.plan.outputs.socket_source_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p state
          STATE_FILE="state/service-state.json"

          if gh release view current-state >/dev/null 2>&1; then
            gh release download current-state --pattern "service-state.json" --dir state || true
          fi

          if [ ! -f "$STATE_FILE" ]; then
            cat > "$STATE_FILE" <<'EOF'
          {
            "frontend": "",
            "dong": "",
            "indexer": "",
            "socket": ""
          }
          EOF
          fi

          python3 - <<'PY'
          import json, os

          state_file = "state/service-state.json"
          with open(state_file, "r", encoding="utf-8") as f:
              state = json.load(f)

          def effective(mode, source_tag, target_tag, current_value):
              if mode in ("build", "repackage"):
                  return target_tag or current_value or ""
              if mode == "redeploy":
                  return source_tag or current_value or ""
              return current_value or ""

          frontend_mode = os.environ["FRONTEND_MODE"]
          dong_mode = os.environ["DONG_MODE"]
          indexer_mode = os.environ["INDEXER_MODE"]
          socket_mode = os.environ["SOCKET_MODE"]

          target_tag = os.environ["TARGET_TAG"]

          frontend_source = os.environ["FRONTEND_SOURCE_TAG"]
          dong_source = os.environ["DONG_SOURCE_TAG"]
          indexer_source = os.environ["INDEXER_SOURCE_TAG"]
          socket_source = os.environ["SOCKET_SOURCE_TAG"]

          state["frontend"] = effective(frontend_mode, frontend_source, target_tag, state.get("frontend", ""))
          state["dong"] = effective(dong_mode, dong_source, target_tag, state.get("dong", ""))
          state["indexer"] = effective(indexer_mode, indexer_source, target_tag, state.get("indexer", ""))
          state["socket"] = effective(socket_mode, socket_source, target_tag, state.get("socket", ""))

          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f'frontend_effective_tag={state["frontend"]}\n')
              out.write(f'dong_effective_tag={state["dong"]}\n')
              out.write(f'indexer_effective_tag={state["indexer"]}\n')
              out.write(f'socket_effective_tag={state["socket"]}\n')
          PY

      - name: Upload service state artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-state
          path: state/service-state.json
          if-no-files-found: error


  deploy-indexer:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.indexer_mode != 'skip'
    uses: ./.github/workflows/deploy-indexer-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      mode: ${{ needs.determine_tags.outputs.indexer_mode }}
      target_tag: ${{ needs.determine_tags.outputs.target_tag }}
      source_tag: ${{ needs.determine_tags.outputs.indexer_source_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}

  deploy-dong:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.dong_mode != 'skip'
    uses: ./.github/workflows/deploy-dong-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      mode: ${{ needs.determine_tags.outputs.dong_mode }}
      target_tag: ${{ needs.determine_tags.outputs.target_tag }}
      source_tag: ${{ needs.determine_tags.outputs.dong_source_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
      VERIFYING_KEY_B64: ${{ secrets.VERIFYING_KEY_B64 }}
 
  deploy-frontend:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.frontend_mode != 'skip'
    uses: ./.github/workflows/deploy-frontend-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      mode: ${{ needs.determine_tags.outputs.frontend_mode }}
      target_tag: ${{ needs.determine_tags.outputs.target_tag }}
      source_tag: ${{ needs.determine_tags.outputs.frontend_source_tag }}
    secrets:
      NEXT_PUBLIC_COBAR_API_KEY: ${{ secrets.NEXT_PUBLIC_COBAR_API_KEY }}
      NEXT_PUBLIC_MEZON_SERVER_KEY: ${{ secrets.NEXT_PUBLIC_MEZON_SERVER_KEY }}

  deploy-socket:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.socket_mode != 'skip'
    uses: ./.github/workflows/deploy-socket-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      mode: ${{ needs.determine_tags.outputs.socket_mode }}
      target_tag: ${{ needs.determine_tags.outputs.target_tag }}
      source_tag: ${{ needs.determine_tags.outputs.socket_source_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

  create_release:
    needs: [determine_tags, deploy-indexer, deploy-dong, deploy-frontend, deploy-socket]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.determine_tags.result == 'success' &&
      needs.determine_tags.outputs.should_release == 'true'
    steps:
      - name: Create workspace
        run: mkdir -p release-assets

      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine_tags.outputs.target_tag }}
          name: Release ${{ needs.determine_tags.outputs.target_tag }}
          overwrite: true
          body: |
            Target build tag: ${{ needs.determine_tags.outputs.target_tag }}

            Frontend: ${{ needs.determine_tags.outputs.frontend_effective_tag }}
            Dong: ${{ needs.determine_tags.outputs.dong_effective_tag }}
            Indexer: ${{ needs.determine_tags.outputs.indexer_effective_tag }}
            Socket: ${{ needs.determine_tags.outputs.socket_effective_tag }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_current_state:
    needs: [determine_tags, create_release]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.determine_tags.result == 'success'
    steps:
      - name: Download service state
        uses: actions/download-artifact@v4
        with:
          name: service-state
          path: state

      - name: Publish current-state release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current-state
          name: Current State
          overwrite: true
          body: |
            Frontend: ${{ needs.determine_tags.outputs.frontend_effective_tag }}
            Dong: ${{ needs.determine_tags.outputs.dong_effective_tag }}
            Indexer: ${{ needs.determine_tags.outputs.indexer_effective_tag }}
            Socket: ${{ needs.determine_tags.outputs.socket_effective_tag }}
          files: state/service-state.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
