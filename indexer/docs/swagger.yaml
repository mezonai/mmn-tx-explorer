        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      security:
      - BasicAuth: []
      summary: Get all blocks
      tags:
      - blocks
  /{chainId}/blocks/{blockNumber}/detail:
    get:
