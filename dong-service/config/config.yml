# Server Configuration
server:
  host: 0.0.0.0
  port: 8888
  gin_mode: debug

database:
  host: 172.16.100.180
  port: 5432
  username: admin
  password: password
  name: indexer
  schema: dong_schema
  sslmode: disable
  max_open_conns: 50        # Increased for better concurrency
  max_idle_conns: 10        # Increased for better connection reuse
  conn_max_lifetime: 300    # 5 minutes - connections will be refreshed
  conn_max_idle_time: 60    # 1 minute - idle connections will be closed

indexer:
  schema: public

blockchain:
  rpc_url: "172.16.100.180:9001"
  use_tls: false

cors:
  allow_origins: "*"
  allow_methods: "POST, OPTIONS, GET, PUT, DELETE, PATCH"
  allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With"
  allow_credentials: true


jwt:
  secret: "a75081d475a4cd4e130916f26e3e8d3ebc376fa132e873c057c5a0c5ab26cc06"
  refresh_exp: 432000
  access_exp: 3600

oauth:
  client_id: "1976233808680194048"
  client_secret: ">cxIm=C8v[Be0XE0@bius4UhLqu{P&8="
  token_url: "https://oauth2.mezon.ai/oauth2/token"
  user_info_url: "https://oauth2.mezon.ai/userinfo"

redis:
  address: "redis:6379"
  password: ""
  db: 0

# Logging Configuration
logging:
  level: "info"           # debug, info, warn, error, fatal, panic
  output: "stdout"        # stdout or file
  file_path: "logs/dong-service.log"  # required when output=file
  max_size: 100           # max size in MB before rotation (default: 100)
  max_age: 30             # max age in days to retain old logs (default: 30)

# Scheduler Configuration
scheduler:
  sync_contributors_interval: 600  # sync every 10 minutes (600 seconds)
  expired_red_envelopes_interval: 3600  # sync every 60 minutes (3600 seconds)
  expired_orders_interval: 60  # check expired orders every 60 seconds
  recent_stats_window_days: 7      # lookback window in days used by recent_amount & sync jobs

# Lock Configuration
lock:
  Lock_Exp: 3          # Lock expiration time in seconds
  Cnt_Retry: 10          # Number of retries to acquire the lock
  Retry_Delay: 300      # Delay between retries in milliseconds

# Cache Request Configuration
cache_request:
  Cache_Exp: 20        # Cache expiration time in seconds

# Rate Limit Configuration
rate_limit:
  ip_rate_limit_per_sec: 1
  ip_rate_limit_burst: 2

# Image Filter Configuration
filter_image:
  max_size_upload: 20 # MB
  block_mime_types: 
     - "image/svg+xml"
  enable_virus_scan: false
  virus_scan_url: "tcp://127.0.0.1:3310"
  ipfs_url: "/ip4/127.0.0.1/tcp/5001"

# Event Configuration
event:
  api_url: "http://localhost:8899/api/event"
  api_key: "MezonDongServiceEventAPIKey2024!"

# Zero-Knowledge Proof Configuration
zk:
  verification_key_path: "./config/verifying_key.b64"
