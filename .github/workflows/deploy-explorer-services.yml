name: Deploy Transaction Explorer Services

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "main"

jobs:
  build:
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}
    outputs:
      git_sha: ${{ steps.get_sha.outputs.git_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          check-latest: false

      - name: Build Indexer binary
        run: |
          mkdir -p build
          cd indexer
          GOOS=linux GOARCH=amd64 go build -o ../build/indexer .

      - name: Get short SHA
        id: get_sha
        run: echo "git_sha=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: ""

      - name: Build Frontend
        env:
          NEXT_PUBLIC_APP_API_URL: ${{ vars.NEXT_PUBLIC_APP_API_URL }}
          APP_API_URL_INTERNAL: ${{ vars.APP_API_URL_INTERNAL }}
          NEXT_PUBLIC_CHAT_APP_MMN_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_MMN_API_URL }}
          NEXT_PUBLIC_CHAT_APP_ZK_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_ZK_API_URL }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_OAUTH2_API_URL: ${{ vars.NEXT_PUBLIC_OAUTH2_API_URL }}
          NEXT_PUBLIC_OAUTH2_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          NEXT_PUBLIC_OAUTH2_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_OAUTH2_REDIRECT_URI }}
        run: |
          cd frontend
          npm install
          rm -rf .next
          npm run build
          cd ..

  deploy-explorer:
    needs: build
    runs-on: [self-hosted, Linux, mezon-runner]
    environment: ${{ inputs.env }}
    env:
      TARGET_HOST: ${{ inputs.env == 'prod' && 'prod-indexer' || 'dev-indexer' }}
      GIT_SHA: ${{ needs.build.outputs.git_sha }}

    steps:
      - name: Copy config and secrets to target
        run: |
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} indexer/configs/config.example.yml ${{ vars.HOST_ALIAS }}:/opt/mezon/explorer/config/
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} indexer/configs/secrets.example.yml ${{ vars.HOST_ALIAS }}:/opt/mezon/explorer/config/

      - name: Generate remote setup script
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          NEXT_PUBLIC_APP_API_URL: ${{ vars.NEXT_PUBLIC_APP_API_URL }}
          APP_API_URL_INTERNAL: ${{ vars.APP_API_URL_INTERNAL }}
          NEXT_PUBLIC_CHAT_APP_MMN_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_MMN_API_URL }}
          NEXT_PUBLIC_CHAT_APP_ZK_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_APP_ZK_API_URL }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_OAUTH2_API_URL: ${{ vars.NEXT_PUBLIC_OAUTH2_API_URL }}
          NEXT_PUBLIC_OAUTH2_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          NEXT_PUBLIC_OAUTH2_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_OAUTH2_REDIRECT_URI }}
        run: |
          cat > remote_setup.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SHA="$1"
          echo "==> Preparing deployment directories and configs..."
          sudo mkdir -p /opt/indexer/bin /opt/indexer/config /opt/indexer/migrations /opt/indexer/logs
          
          echo "==> Writing environment configs..."
          sudo tee /opt/indexer/config/indexer.env > /dev/null <<EON
          STORAGE_MAIN_POSTGRES_HOST=${POSTGRES_HOST}
          STORAGE_MAIN_POSTGRES_PORT=${POSTGRES_PORT}
          STORAGE_MAIN_POSTGRES_USERNAME=${POSTGRES_USER}
          STORAGE_MAIN_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          STORAGE_MAIN_POSTGRES_DATABASE=${POSTGRES_DB}
          STORAGE_MAIN_POSTGRES_SSLMODE=disable
          MIGRATIONS_PATH=/opt/indexer/migrations/postgres
          EON

          sudo tee /opt/frontend/frontend.env > /dev/null <<EON
          NEXT_PUBLIC_APP_API_URL=${NEXT_PUBLIC_APP_API_URL}
          APP_API_URL_INTERNAL=${APP_API_URL_INTERNAL}
          NEXT_PUBLIC_CHAT_APP_MMN_API_URL=${NEXT_PUBLIC_CHAT_APP_MMN_API_URL}
          NEXT_PUBLIC_CHAT_APP_ZK_API_URL=${NEXT_PUBLIC_CHAT_APP_ZK_API_URL}
          NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL}
          NEXT_PUBLIC_OAUTH2_API_URL=${NEXT_PUBLIC_OAUTH2_API_URL}
          NEXT_PUBLIC_OAUTH2_CLIENT_ID=${NEXT_PUBLIC_OAUTH2_CLIENT_ID}
          OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
          NEXT_PUBLIC_OAUTH2_REDIRECT_URI=${NEXT_PUBLIC_OAUTH2_REDIRECT_URI}
          EON

          sudo chown -R mmn:mmn /opt/indexer
          sudo chown -R mmn:mmn /opt/frontend
          sudo chmod 600 /opt/indexer/config/indexer.env
          sudo chmod 644 /opt/frontend/frontend.env

          echo "==> Deploying new indexer binary to staging path..."
          sudo install -m 0755 /tmp/indexer /opt/indexer/bin/indexer-${SHA}

          echo "==> Deploying migrations..."
          sudo rm -rf /opt/indexer/migrations/postgres
          sudo mv /tmp/postgres-indexer /opt/indexer/migrations/postgres

          echo "==> Preparation complete!"
          EOF
          chmod +x remote_setup.sh

          echo "# Remote env generated at $(date)" > remote_env.sh
          printf "export POSTGRES_DB=%q\n" "$POSTGRES_DB" >> remote_env.sh
          printf "export POSTGRES_USER=%q\n" "$POSTGRES_USER" >> remote_env.sh
          printf "export POSTGRES_PASSWORD=%q\n" "$POSTGRES_PASSWORD" >> remote_env.sh
          printf "export POSTGRES_HOST=%q\n" "$POSTGRES_HOST" >> remote_env.sh
          printf "export POSTGRES_PORT=%q\n" "$POSTGRES_PORT" >> remote_env.sh
          printf "export NEXT_PUBLIC_APP_API_URL=%q\n" "$NEXT_PUBLIC_APP_API_URL" >> remote_env.sh
          printf "export APP_API_URL_INTERNAL=%q\n" "$APP_API_URL_INTERNAL" >> remote_env.sh
          printf "export NEXT_PUBLIC_CHAT_APP_MMN_API_URL=%q\n" "$NEXT_PUBLIC_CHAT_APP_MMN_API_URL" >> remote_env.sh
          printf "export NEXT_PUBLIC_CHAT_APP_ZK_API_URL=%q\n" "$NEXT_PUBLIC_CHAT_APP_ZK_API_URL" >>  remote_env.sh
          printf "export NEXT_PUBLIC_BACKEND_API_URL=%q\n" "$NEXT_PUBLIC_BACKEND_API_URL" >> remote_env.sh
          printf "export NEXT_PUBLIC_OAUTH2_API_URL=%q\n" "$NEXT_PUBLIC_OAUTH2_API_URL" >> remote_env.sh
          printf "export NEXT_PUBLIC_OAUTH2_CLIENT_ID=%q\n" "$NEXT_PUBLIC_OAUTH2_CLIENT_ID" >> remote_env.sh
          printf "export OAUTH2_CLIENT_SECRET=%q\n" "$OAUTH2_CLIENT_SECRET" >> remote_env.sh
          printf "export NEXT_PUBLIC_OAUTH2_REDIRECT_URI=%q\n" "$NEXT_PUBLIC_OAUTH2_REDIRECT_URI" >> remote_env.sh

      - name: Prepare and deploy to target server
        run: |
          set -e
          echo "==> Copying binaries to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} build/indexer ${{ vars.HOST_ALIAS }}:/tmp/
          
          echo "==> Copying migrations to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} -r indexer/internal/tools/postgres ${{ vars.HOST_ALIAS }}:/tmp/postgres-indexer/

          echo "==> Copying setup scripts to target server..."
          scp -i ${{ vars.SSH_PRIVATE_KEY_PATH }} remote_setup.sh remote_env.sh ${{ vars.HOST_ALIAS }}:/tmp/

          echo "==> Syncing Frontend build to target..."
          rsync -az --delete -e "ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }}" frontend/.next/standalone/ ${{ vars.HOST_ALIAS }}:/opt/frontend/.next/standalone/
          rsync -az --delete -e "ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }}" frontend/public/ ${{ vars.HOST_ALIAS }}:/opt/frontend/.next/standalone/public/
          rsync -az --delete -e "ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }}" frontend/.next/static/ ${{ vars.HOST_ALIAS }}:/opt/frontend/.next/standalone/.next/static/

          echo "==> Running remote setup script..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "
            set -e
            source /tmp/remote_env.sh
            bash /tmp/remote_setup.sh \"$GIT_SHA\"
            
            echo '==> Cleaning up temp files...'
            rm -f /tmp/indexer
            rm -f /tmp/remote_setup.sh /tmp/remote_env.sh
            rm -rf /tmp/postgres-indexer
          "

      - name: Atomic swap + restart services
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          MMN_GRPC_URL: ${{ vars.MMN_GRPC_URL }}
          MMN_GRPC_USE_TLS: ${{ vars.MMN_GRPC_USE_TLS }}
        run: |
          ssh -i ${{vars.SSH_PRIVATE_KEY_PATH}} ${{vars.HOST_ALIAS}} <<EOF
          #!/usr/bin/env bash
          set -euo pipefail

          echo "==> Generating final config files on target server..."
          sudo mkdir -p /etc/mezon
          echo "--> Generating config for indexer-api"
          sed \
            -e "s|__POSTGRES_DB__|$POSTGRES_DB|g" \
            -e "s|__POSTGRES_USER__|$POSTGRES_USER|g" \
            -e "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" \
            -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
            -e "s|__POSTGRES_PORT__|$POSTGRES_PORT|g" \
            -e "s|__MMN_GRPC_URL__|$MMN_GRPC_URL|g" \
            -e "s|__MMN_GRPC_USE_TLS__|$MMN_GRPC_USE_TLS|g" \
            -e "s|filePath: /opt/indexer/logs/indexer.log|filePath: /opt/indexer/logs/indexer-api.log|g" \
            /opt/mezon/explorer/config/config.example.yml \
            | sudo tee /etc/mezon/config-api.yml >/dev/null

          echo "--> Generating config for indexer-orchestrator"
          sed \
            -e "s|__POSTGRES_DB__|$POSTGRES_DB|g" \
            -e "s|__POSTGRES_USER__|$POSTGRES_USER|g" \
            -e "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" \
            -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
            -e "s|__POSTGRES_PORT__|$POSTGRES_PORT|g" \
            -e "s|__MMN_GRPC_URL__|$MMN_GRPC_URL|g" \
            -e "s|__MMN_GRPC_USE_TLS__|$MMN_GRPC_USE_TLS|g" \
            -e "s|filePath: /opt/indexer/logs/indexer.log|filePath: /opt/indexer/logs/indexer-orchestrator.log|g" \
            /opt/mezon/explorer/config/config.example.yml \
            | sudo tee /etc/mezon/config-orchestrator.yml >/dev/null

          sed \
            -e "s|__POSTGRES_DB__|$POSTGRES_DB|g" \
            -e "s|__POSTGRES_USER__|$POSTGRES_USER|g" \
            -e "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" \
            -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
            -e "s|__POSTGRES_PORT__|$POSTGRES_PORT|g" \
            -e "s|__MMN_GRPC_URL__|$MMN_GRPC_URL|g" \
            -e "s|__MMN_GRPC_USE_TLS__|$MMN_GRPC_USE_TLS|g" \
            /opt/mezon/explorer/config/secrets.example.yml \
            | sudo tee /etc/mezon/secrets.yml >/dev/null

          echo "==> Stopping services..."
          sudo systemctl stop frontend-explorer || true
          sudo systemctl stop indexer-api || true
          sudo systemctl stop indexer-orchestrator || true

          echo "==> Atomically swapping to new indexer binary..."
          sudo ln -sfn indexer-${GIT_SHA} /opt/indexer/bin/indexer

          echo "==> Running database migrations..."
          set -a
          source /opt/indexer/config/indexer.env
          set +a
          /opt/indexer/bin/indexer migrate-postgres

          echo "==> Reloading and starting services..."
          sudo systemctl daemon-reload
          sudo systemctl start indexer-orchestrator
          sudo systemctl start indexer-api
          sudo systemctl start frontend-explorer

          echo "==> Reloading Nginx..."
          sudo nginx -t && sudo systemctl reload nginx

          echo "==> Activation complete!"
          EOF

      - name: Health check after deployment
        run: |
          echo "==> Checking API status..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "curl -sSf http://127.0.0.1:8080/health"

          echo "==> Checking Orchestrator status..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "systemctl is-active indexer-orchestrator"

          echo "==> Checking Frontend status..."
          ssh -i ${{ vars.SSH_PRIVATE_KEY_PATH }} ${{ vars.HOST_ALIAS }} "systemctl is-active frontend-explorer"
  
  deploy-dong:
    uses: ./.github/workflows/deploy-dong-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}