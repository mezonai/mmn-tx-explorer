# add mmnGrpcUrl to override config.yml in case you change the mmnGrpcUrl for different environments
rpc:
  mmnGrpcUrl: "__MMN_GRPC_URL__"
#Storage configuration for different database connections
storage:
  # Main storage configuration for primary data operations
  main:
    postgres:
      host: "__POSTGRES_HOST__"
      port: "__POSTGRES_PORT__"
      username: "__POSTGRES_USER__"
      password: "__POSTGRES_PASSWORD__"
      database: "__POSTGRES_DB__"
      sslMode: disable
      maxOpenConns: 60
      maxIdleConns: 30
      maxConnLifetime: 3600
      connectTimeout: 30
  
  dong:
    postgres:
      host: "__DONG_POSTGRES_HOST__"
      port: "__DONG_POSTGRES_PORT__"
      username: "__DONG_POSTGRES_USER__"
      password: "__DONG_POSTGRES_PASSWORD__"
      database: "__DONG_POSTGRES_DB__"
      sslMode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      maxConnLifetime: 3600
      connectTimeout: 30
  
  # Staging storage configuration for temporary data processing
  staging:
    postgres:
      host: "__POSTGRES_HOST__"
      port: "__POSTGRES_PORT__"
      username: "__POSTGRES_USER__"
      password: "__POSTGRES_PASSWORD__"
      database: "__POSTGRES_DB__"
      sslMode: disable
      maxOpenConns: 25
      maxIdleConns: 12
      maxConnLifetime: 3600
      connectTimeout: 30
  
  # Orchestrator storage configuration for coordination data
  orchestrator:
    postgres:
      host: "__POSTGRES_HOST__"
      port: "__POSTGRES_PORT__"
      username: "__POSTGRES_USER__"
      password: "__POSTGRES_PASSWORD__"
      database: "__POSTGRES_DB__"
      sslMode: disable
      maxOpenConns: 18
      maxIdleConns: 9
      maxConnLifetime: 3600
      connectTimeout: 30

#API configuration for HTTP endpoints
api:
  # Basic authentication credentials for API access
  basicAuth: 
    # Username for API authentication
    username: 
    # Password for API authentication
    password: 

#Publisher configuration for data publishing services
publisher:
  # Username for publisher service authentication
  username: admin
  # Password for publisher service authentication
  password: password