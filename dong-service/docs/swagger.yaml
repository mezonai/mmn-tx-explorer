definitions:
  models.CreateDonationCampaignRequest:
    properties:
      creator:
        type: integer
      description:
        type: string
      donation_wallet:
        type: string
      end_date:
        type: string
      goal:
        type: integer
      name:
        type: string
      url:
        type: string
    required:
    - creator
    - donation_wallet
    - name
    type: object
  models.DonationCampaignResponse:
    properties:
      created_at:
        type: string
      creator:
        type: integer
      description:
        type: string
      donation_wallet:
        type: string
      end_date:
        type: string
      goal:
        type: integer
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  models.UpdateDonationCampaignRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      goal:
        type: integer
      name:
        type: string
      url:
        type: string
    type: object
host: localhost:8888
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for managing donation campaigns
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Dong Service API
  version: "1.0"
paths:
  /api/v1/campaigns:
    get:
      description: Get a list of all donation campaigns with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.DonationCampaignResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: List all donation campaigns
      tags:
      - campaigns
    post:
      consumes:
      - application/json
      description: Create a new donation campaign
      parameters:
      - description: Campaign data
        in: body
        name: campaign
        required: true
        schema:
          $ref: '#/definitions/models.CreateDonationCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DonationCampaignResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: Create a new donation campaign
      tags:
      - campaigns
  /api/v1/campaigns/{id}:
    get:
      description: Get details of a specific donation campaign
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DonationCampaignResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: Get a donation campaign by ID
      tags:
      - campaigns
    put:
      consumes:
      - application/json
      description: Update an existing donation campaign
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      - description: Campaign data
        in: body
        name: campaign
        required: true
        schema:
          $ref: '#/definitions/models.UpdateDonationCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DonationCampaignResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: Update a donation campaign
      tags:
      - campaigns
  /api/v1/campaigns/{id}/activate:
    patch:
      description: Set campaign status to Active
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DonationCampaignResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: Activate a donation campaign
      tags:
      - campaigns
  /api/v1/campaigns/{id}/close:
    patch:
      description: Set campaign status to Closed
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DonationCampaignResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: Close a donation campaign
      tags:
      - campaigns
  /health:
    get:
      consumes:
      - application/json
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
schemes:
- http
- https
swagger: "2.0"
