<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mezon Explorer · Swap Assets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#6941c6",
            "primary-light": "#8b5cf6",
            "primary-dark": "#553c9a",
            dark: "#0B1533",
            "dark-light": "#1e293b",
            neon: "#00f5ff"
          },
          fontFamily: {
            inter: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
</head>

<body class="bg-dark text-white font-inter">
  <div class="max-w-md mx-auto mt-16 bg-dark-light border border-gray-700 rounded-2xl p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-semibold text-white">Swap</h2>
      <i class="fa-solid fa-gear text-gray-400 hover:text-white cursor-pointer"></i>
    </div>

    <!-- FROM -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <span class="text-gray-300 text-sm">From</span>
        <span class="text-gray-400 text-xs">USDT (BEP20)</span>
      </div>

      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 hover:border-primary/50 transition">
        <div class="flex items-center justify-between mb-2">
          <input type="number" placeholder="0.0" class="bg-transparent text-white text-2xl w-full focus:outline-none" />
          <div class="flex items-center space-x-2 cursor-pointer">
            <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" class="w-6 h-6">
            <span class="text-white font-semibold">USDT</span>
            <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
          </div>
        </div>

        <!-- Wallet state -->
        <div class="flex items-center justify-between text-xs text-gray-400 mt-2">
          <span>Balance: 0.00</span>

          <!-- Nếu chưa connect MetaMask -->
          <button class="text-primary hover:text-primary-light">
            Connect MetaMask
          </button>

          <!-- Nếu đã connect -->
          <span>0x9f1d...91f7</span>
        </div>
      </div>
    </div>

    <!-- Swap Icon -->
    <div class="flex justify-center my-4">
      <div class="w-10 h-10 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center">
        <i class="fa-solid fa-arrow-down text-gray-300"></i>
      </div>
    </div>

    <!-- TO -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <span class="text-gray-300 text-sm">To</span>
        <span class="text-gray-400 text-xs">MZĐ (Mezon Mainnet)</span>
      </div>

      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 hover:border-primary/50 transition">
        <div class="flex items-center justify-between mb-2">
          <input type="text" placeholder="0.0" disabled class="bg-transparent text-white text-2xl w-full opacity-50" />
          <div class="flex items-center space-x-2 cursor-pointer opacity-50">
            <i class="fa-solid fa-circle text-primary"></i>
            <span class="text-white font-semibold">MZĐ</span>
          </div>
        </div>

        <!-- Wallet state -->
        <div class="flex items-center justify-between text-xs text-gray-400 mt-2">

          <!-- Nếu chưa login -->
          <button class="text-primary hover:text-primary-light">
            Login Mezon
          </button>

          <!-- Nếu đã login -->
          <span>3YD56eC...45no</span>
        </div>
      </div>
    </div>

    <!-- Rate -->
    <div class="text-center text-gray-400 text-sm mb-6">
      1 USDT = 0.98 MZĐ • Fee: 0.1%
    </div>

    <!-- Review Button -->
    <button class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-xl">
      Review Swap
    </button>
  </div>

</body>

</html>
