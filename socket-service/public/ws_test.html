<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #messages { border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto; }
    #loginBtn { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>WebSocket Test</h2>
  <label>JWT Token: <input type="text" id="jwtToken" style="width:80%" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NjQ4MzU4NjEsInRva2VuX2lkIjoiMGYwY2U4ZWItOWYyNi00ZjVlLTk1ZTMtMTQwYTU5MDE4NTI2IiwidHlwZSI6ImFjY2VzcyIsInVzZXJfaWQiOiIxOTUwODc1MzUwODI5MzcxMzkyIn0.aPpVjfKsiNqcC_MnPQnD_Pda7U_aSInLwpuJsOxR68k"></label>
  <button id="loginBtn">Login (Connect WS)</button>
  <h3>Messages from server:</h3>
  <div id="messages"></div>

  <script>
    let ws;
    document.getElementById('loginBtn').onclick = function() {
      const token = document.getElementById('jwtToken').value.trim();
      if (!token) {
        alert('Vui lòng nhập JWT token!');
        return;
      }
      ws = new WebSocket(`ws://localhost:8899/ws/connect?token=${encodeURIComponent(token)}`);
      ws.onopen = function() {
        document.getElementById('messages').innerHTML += '<div><b>Connected!</b></div>';
      };
      ws.onmessage = function(event) {
        document.getElementById('messages').innerHTML += `<div>${event.data}</div>`;
      };
      ws.onclose = function() {
        document.getElementById('messages').innerHTML += '<div><b>Disconnected!</b></div>';
      };
      ws.onerror = function(e) {
        document.getElementById('messages').innerHTML += `<div style="color:red"><b>Error:</b> ${e.message}</div>`;
      };
    };
  </script>
</body>
</html>
