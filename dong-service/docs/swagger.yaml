      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.DonationCampaignResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: Create and immediately activate a new donation campaign
      tags:
      - campaigns
  /api/v1/campaigns:
    get:
      description: Get a list of all donation campaigns with pagination
      parameters:
      - default: 0
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by status (e.g., 0=draft,1=active,2=closed)
        in: query
        name: status
        type: integer
      - default: desc
        description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: created_at
        description: Sort field
        enum:
        - created_at
        - total_amount
        in: query
        name: order_by
        type: string
      - description: Search (name or description)
        in: query
        name: q
        type: string
      - description: Search (name or description) (alias)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.PaginatedResponse'
            - properties:
                ' meta':
                  $ref: '#/definitions/models.PaginationMeta'
                data:
                  items:
                    $ref: '#/definitions/models.DonationCampaignResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: List all donation campaigns
      tags:
      - campaigns
  /api/v1/campaigns/{id}:
    get:
