server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://172.16.100.180:3100/loki/api/v1/push

scrape_configs:
  - job_name: indexer
    static_configs:
      - targets:
          - localhost
        labels:
          job: indexer
          __path__: /app/logs/indexer.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            message: message
            component: component
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          component:
