# Server Configuration
server:
  host: 0.0.0.0
  port: 8888
  gin_mode: debug

database:
  host: localhost
  port: 5432
  username: admin
  password: password
  name: indexer
  schema: dong_schema
  sslmode: disable
  max_open_conns: 50        # Increased for better concurrency
  max_idle_conns: 10        # Increased for better connection reuse
  conn_max_lifetime: 300    # 5 minutes - connections will be refreshed
  conn_max_idle_time: 60    # 1 minute - idle connections will be closed

indexer:
  schema: public

cors:
  allow_origins: "*"
  allow_methods: "POST, OPTIONS, GET, PUT, DELETE, PATCH"
  allow_headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With"
  allow_credentials: true


