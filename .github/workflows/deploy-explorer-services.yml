name: Deploy Transaction Explorer Services
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (dev|prod)"
        required: true
        default: "dev"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "main"
      new_tag_to_build:
        description: "(Optional) New tag "
        required: false

jobs:
  determine_tags:
    runs-on: [self-hosted, Linux, mezon-runner]
    outputs:
      release_tag: ${{ steps.tags.outputs.release_tag }}
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
      indexer_tag: ${{ steps.tags.outputs.indexer_tag }}
      socket_tag: ${{ steps.tags.outputs.socket_tag }}
      dong_tag: ${{ steps.tags.outputs.dong_tag }}

      build_frontend: ${{ steps.detect.outputs.frontend }}
      build_dong: ${{ steps.detect.outputs.dong }}
      build_socket: ${{ steps.detect.outputs.socket }}
      build_indexer: ${{ steps.detect.outputs.indexer }}

      should_release: ${{ steps.tags.outputs.should_release }}
    steps:
      - name: Checkout for git history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }} 
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          set -e

          if [ -n "${{ inputs.new_tag_to_build }}" ]; then
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "dong=false" >> $GITHUB_OUTPUT
            echo "socket=false" >> $GITHUB_OUTPUT
            echo "indexer=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ inputs.env }}" = "dev" ]; then
            BASE_BRANCH="origin/develop"
            git fetch origin develop
          elif [ "${{ inputs.env }}" = "prod" ]; then
            BASE_BRANCH="origin/main"
            git fetch origin main
          else
            echo "Invalid env input"
            exit 1
          fi

          detect() {
            local svc=$1
              if git diff --quiet "$BASE_BRANCH..HEAD" -- "$svc/"; then
              echo false
            else
              echo true
            fi
          }

          echo "frontend=$(detect frontend)" >> $GITHUB_OUTPUT
          echo "dong=$(detect dong)" >> $GITHUB_OUTPUT
          echo "socket=$(detect socket)" >> $GITHUB_OUTPUT
          echo "indexer=$(detect indexer)" >> $GITHUB_OUTPUT

      - name: Calculate tags
        id: tags
        run: |
          set -e

          git fetch --tags --force

          normalize() {
            [[ "$1" == v* ]] && echo "$1" || echo "v$1"
          }

          latest() {
            local service_pattern="${1}-v*"
            local tag=$(git tag -l "$service_pattern" --sort=-v:refname | head -n1)
            
            if [ -z "$tag" ]; then
              tag=$(git tag -l "v*" --sort=-v:refname | head -n1)
            fi
            
            echo "$tag"
          }

          increment() {
            local clean_version=${1#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$clean_version"
            PATCH=$((PATCH+1))
            echo "${MAJOR}.${MINOR}.${PATCH}"
          }

          bump_service() {
            local SERVICE=$1
            local LATEST=$(latest "$SERVICE")
          
            echo "Service [$SERVICE] -> Latest Tag from Git: '$LATEST'" >&2
          
            if [ -z "$LATEST" ]; then
              echo "${SERVICE}-v0.0.1"
            else
              if [[ "$LATEST" == "$SERVICE"* ]]; then
                VERSION_PART=${LATEST#$SERVICE-v}
              else
                VERSION_PART=${LATEST#v}
              fi
              
              NEW_VERSION=$(increment "$VERSION_PART")
              echo "${SERVICE}-v${NEW_VERSION}"
              echo "New incremented version: '$NEW_VERSION'" >&2
            fi
          }

          bump_release() {
            LATEST=$(latest "release-v*")

            if [ -z "$LATEST" ]; then
              echo "release-v0.1.0"
            else
              VERSION=${LATEST#release-v}
              NEW_VERSION=$(increment $VERSION)
              echo "release-v${NEW_VERSION}"
            fi
          }

          BUILT=false

          if [ -n "${{ inputs.new_tag_to_build }}" ]; then
            RAW=$(normalize "${{ inputs.new_tag_to_build }}")
            if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format. Must be vX.Y.Z"
              exit 1
            fi

            RELEASE="release-${RAW}"
            FRONTEND="frontend-${RAW}"
            DONG="dong-${RAW}"
            SOCKET="socket-${RAW}"
            INDEXER="indexer-${RAW}"

            SHOULD=true
          else

            BUILT=false

            if [ "${{ steps.detect.outputs.frontend }}" = "true" ]; then
              FRONTEND=$(bump_service frontend)
              BUILT=true
            else
              FRONTEND=$(latest frontend)
            fi

            if [ "${{ steps.detect.outputs.dong }}" = "true" ]; then
              DONG=$(bump_service dong)
              BUILT=true
            else  
              DONG=$(latest dong) 
            fi

            if [ "${{ steps.detect.outputs.socket }}" = "true" ]; then
              SOCKET=$(bump_service socket)
              BUILT=true
            else
              SOCKET=$(latest socket)
            fi

            if [ "${{ steps.detect.outputs.indexer }}" = "true" ]; then
              INDEXER=$(bump_service indexer)
              BUILT=true
            else
              INDEXER=$(latest indexer)
            fi

            if [ "$BUILT" = "true" ]; then
              RELEASE=$(bump_release)
              SHOULD=true
            else
              RELEASE=$(latest "release-v*")
              SHOULD=false
            fi
          fi

          echo "release_tag=$RELEASE" >> $GITHUB_OUTPUT
          echo "frontend_tag=$FRONTEND" >> $GITHUB_OUTPUT
          echo "dong_tag=$DONG" >> $GITHUB_OUTPUT
          echo "socket_tag=$SOCKET" >> $GITHUB_OUTPUT
          echo "indexer_tag=$INDEXER" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD" >> $GITHUB_OUTPUT
    
      - name: Push Service Tags for Tracking
        if: steps.tags.outputs.should_release == 'true'
        run: |    
          SERVICES=("frontend" "dong" "socket" "indexer")
          for svc in "${SERVICES[@]}"; do
            VAR_NAME=$(echo "${svc}_TAG" | tr '[:lower:]' '[:upper:]')
            TAG_VAL="${!VAR_NAME}"
            
            IS_CHANGED_VAR=$(echo "${svc}_CHANGED" | tr '[:lower:]' '[:upper:]')
            IS_CHANGED="${!IS_CHANGED_VAR}"
            
            if [ "$IS_CHANGED" = "true" ] && [ -n "$TAG_VAL" ]; then
              echo "Creating tracking tag for $svc: $TAG_VAL"
              git tag -f "$TAG_VAL"
            fi
          done
          
          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_TAG: ${{ steps.tags.outputs.frontend_tag }}
          DONG_TAG: ${{ steps.tags.outputs.dong_tag }}
          SOCKET_TAG: ${{ steps.tags.outputs.socket_tag }}
          INDEXER_TAG: ${{ steps.tags.outputs.indexer_tag }}
          FRONTEND_CHANGED: ${{ steps.detect.outputs.frontend }}
          DONG_CHANGED: ${{ steps.detect.outputs.dong }}
          SOCKET_CHANGED: ${{ steps.detect.outputs.socket }}
          INDEXER_CHANGED: ${{ steps.detect.outputs.indexer }}

  prepare_assets:
    needs: [determine_tags]
    if: inputs.new_tag_to_build != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Repackage Assets from Previous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ inputs.new_tag_to_build }}
          ENV: ${{ inputs.env }}
        run: |
          set -e

          LATEST_RELEASE_TAG=$(git tag -l "release-v*" --sort=-v:refname | head -n1)          echo "Latest release found: $LATEST_RELEASE_TAG"

          mkdir -p temp_assets final_assets          
          gh release download "$LATEST_RELEASE_TAG" --dir temp_assets
          
          cd temp_assets
          for file in *; do
            [[ "$file" == "checksums.txt" ]] && continue
            
            if [[ "$file" == frontend-build-* ]]; then
              NEW_FILE="frontend-build-v${NEW_TAG#v}-${ENV}.tar.gz"
              cp "$file" "../final_assets/$NEW_FILE"
              
            elif [[ "$file" == indexer-v* ]]; then
              NEW_FILE="indexer-v${NEW_TAG#v}"
              cp "$file" "../final_assets/$NEW_FILE"
              
            elif [[ "$file" == dong-v* || "$file" == socket-v* ]]; then
              PREFIX=$(echo "$file" | cut -d'-' -f1)
              cp "$file" "../final_assets/${PREFIX}-v${NEW_TAG#v}"
            fi
          done

      - name: Upload Repackaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-repackaged-assets
          path: final_assets/*
        
  deploy-indexer:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_indexer == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-indexer-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }}
      service_tag: ${{ needs.determine_tags.outputs.indexer_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}

  deploy-dong:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_dong == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-dong-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }} 
      service_tag: ${{ needs.determine_tags.outputs.dong_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
      VERIFYING_KEY_B64: ${{ secrets.VERIFYING_KEY_B64 }}
 
  deploy-frontend:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_frontend == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-frontend-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }} 
      service_tag: ${{ needs.determine_tags.outputs.frontend_tag }}
    secrets:
      NEXT_PUBLIC_COBAR_API_KEY: ${{ secrets.NEXT_PUBLIC_COBAR_API_KEY }}
      NEXT_PUBLIC_MEZON_SERVER_KEY: ${{ secrets.NEXT_PUBLIC_MEZON_SERVER_KEY }}

  deploy-socket:
    needs: [determine_tags]
    if: needs.determine_tags.outputs.build_socket == 'true' && inputs.new_tag_to_build == ''
    uses: ./.github/workflows/deploy-socket-service.yml
    with:
      env: ${{ inputs.env }}
      ref: ${{ inputs.ref }}
      release_tag: ${{ needs.determine_tags.outputs.release_tag }} 
      service_tag: ${{ needs.determine_tags.outputs.socket_tag }}
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EVENT_API_KEY: ${{ secrets.EVENT_API_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

  create_release:
    needs: [determine_tags, prepare_assets, deploy-indexer, deploy-dong, deploy-frontend, deploy-socket]
    runs-on: ubuntu-latest
    if: |
        always() && 
        needs.determine_tags.result == 'success' && 
        needs.determine_tags.outputs.should_release == 'true'
    steps:
      - name: Create Workspace
        run: mkdir -p release-assets

      - name: Download Build Artifacts
        if: inputs.new_tag_to_build == ''
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Download Repackaged Artifacts
        if: inputs.new_tag_to_build != ''
        uses: actions/download-artifact@v4
        with:
          name: manual-repackaged-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine_tags.outputs.release_tag }}
          name: Release ${{ needs.determine_tags.outputs.release_tag }}
          body: |
            Frontend: ${{ needs.determine_tags.outputs.frontend_tag }}
            Dong: ${{ needs.determine_tags.outputs.dong_tag }}
            Socket: ${{ needs.determine_tags.outputs.socket_tag }}
            Indexer: ${{ needs.determine_tags.outputs.indexer_tag }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}