version: '3.8'

services:
  postgres:
    image: postgres:16.10-alpine3.22
    container_name: dong-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dong_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  dong-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dong-service
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8888
      GIN_MODE: debug
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: dong_db
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 25
      DATABASE_MAX_IDLE_CONNS: 5
      JWT_SECRET: "a75081d475a4cd4e130916f26e3e8d3ebc376fa132e873c057c5a0c5ab26cc06"
      JWT_REFRESH_EXP: 432000
      JWT_ACCESS_EXP: 3600
      OAUTH_CLIENT_ID: "1976233808680194048"
      OAUTH_CLIENT_SECRET: ">cxIm=C8v[Be0XE0@bius4UhLqu{P&8="
      OAUTH_TOKEN_URL: "https://oauth2.mezon.ai/oauth2/token"
      OAUTH_USER_INFO_URL: "https://oauth2.mezon.ai/userinfo"
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dong-network
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - dong-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  dong-network:
    driver: bridge

